<div class="flex flex-col gap-4 pb-28">
  <!-- Search Bar & Filter Button -->
  <div class="sticky top-0 z-30 -mx-4 pb-2 bg-gray-50">

    <!-- Top Row: Search and Filter Button -->
    <div class="flex items-center gap-3 px-4 h-14 shrink-0">
      <button type="button" (click)="goBack()"
        class="p-2 -ml-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 cursor-pointer active:scale-95 flex items-center justify-center border-0 shrink-0"
        aria-label="Kembali">
        <i class="bx bx-left-arrow-alt text-2xl"></i>
      </button>
      <div class="flex-1">
        <app-search-bar [placeholder]="'Cari buku, penulis...'" [value]="productStore.searchQuery()" [autofocus]="false"
          (search)="onSearchSubmit($event)"></app-search-bar>
      </div>
      <button type="button" (click)="openFilters()"
        class="flex items-center justify-center shrink-0 w-11 h-11 border border-slate-200 bg-white rounded-full text-slate-700 hover:text-primary-600 hover:bg-slate-50 cursor-pointer active:scale-95 "
        aria-label="More Filters">
        <app-icon name="filter" size="20"></app-icon>
      </button>
    </div>
  </div>

  <!-- Section Header + Category Chips -->
  <section class="flex flex-col gap-4">
    <div class="flex flex-col gap-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="font-display font-extrabold text-slate-800 text-base">Semua Produk</h2>
          <p class="text-[12px] text-slate-400 mt-0.5">Pilihan buku dan aksesori premium terbaik</p>
        </div>
      </div>

      <!-- Category Chips (Always Visible) -->
      <section class="flex flex-col gap-2">
        <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
          <button type="button" (click)="onCategorySelect(null)"
            [class]="productStore.selectedCategoryId() === null ? 'bg-primary-600 border border-primary-700 text-white font-medium flex flex-row gap-2 items-center pl-4 pr-5 py-2.5 rounded-xl text-[12px] whitespace-nowrap cursor-pointer' : 'bg-slate-100 border border-slate-200 flex flex-row font-medium gap-2 items-center pl-4 pr-5 py-2.5 rounded-xl text-[12px] text-slate-600 whitespace-nowrap cursor-pointer'">
            <i class="bx bx-category text-lg"></i>
            Semua
          </button>
          @for (cat of productStore.categories(); track cat.id) {
          <button type="button" (click)="onCategorySelect(cat.id)"
            [class]="productStore.selectedCategoryId() === cat.id ? 'bg-primary-600 border border-primary-700 text-white font-medium flex flex-row gap-2 items-center pl-4 pr-5 py-2.5 rounded-xl text-[12px] whitespace-nowrap cursor-pointer' : 'bg-slate-100 border border-slate-200 flex flex-row font-medium gap-2 items-center pl-4 pr-5 py-2.5 rounded-xl text-[12px] text-slate-600 whitespace-nowrap cursor-pointer'">
            <app-icon [name]="cat.icon" size="18"></app-icon>
            {{ cat.name }}
          </button>
          }
        </div>
      </section>
    </div>

    <!-- Product Grid (Masonry Layout — same as Home) -->
    @if (productStore.loading()) {
    <div class="grid grid-cols-2 gap-2">
      <div><app-skeleton type="card" [count]="1"></app-skeleton></div>
      <div><app-skeleton type="card" [count]="1"></app-skeleton></div>
      <div><app-skeleton type="card" [count]="1"></app-skeleton></div>
      <div><app-skeleton type="card" [count]="1"></app-skeleton></div>
    </div>
    } @else if (productStore.error()) {
    <app-empty-state icon="error" title="Gagal Memuat Produk" [description]="productStore.error() || ''"
      actionText="Coba Lagi" (actionClick)="retryLoading()"></app-empty-state>
    } @else if (productStore.filteredProducts().length === 0) {
    <app-empty-state icon="book-open" title="Tidak Ada Produk"
      description="Kami tidak menemukan produk yang cocok dengan pencarian Anda. Coba ubah kata kunci atau hapus filter."
      actionText="Reset Semua Filter" (actionClick)="resetAllFilters()"></app-empty-state>
    } @else {
    <app-masonry-grid [items]="productStore.filteredProducts()">
      <ng-template let-prod>
        <app-product-card [product]="prod" (addToCart)="onAddToCart($event)"></app-product-card>
      </ng-template>
    </app-masonry-grid>
    }
  </section>

</div>

<!-- Mobile Filters Sheet Drawer (Shared bottom-sheet) -->
<app-bottom-sheet [isOpen]="isFiltersOpen()" title="Urutkan & Filter" (closed)="closeFilters()">
  <div class="flex flex-col gap-6 py-2">

    <!-- Sort selector -->
    <div>
      <div class="flex flex-col">
        <!-- Featured -->
        <button type="button" (click)="onSortChange('featured'); closeFilters()"
          class="flex items-center justify-between w-full py-1.5 px-4 rounded-2xl transition-all duration-200 active:scale-[0.98]"
          [class]="productStore.sortBy() === 'featured' ? 'text-primary-700' : 'bg-white border-slate-200 text-slate-700 hover:border-primary-200 hover:bg-slate-50'">
          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-8 h-8 rounded-full"
              [class]="productStore.sortBy() === 'featured' ? 'bg-slate-100 text-primary-600' : 'bg-slate-100 text-slate-500'">
              <i class="bx bx-slider-alt text-lg"></i>
            </div>
            <span class="font-medium text-[13px]">Paling Sesuai</span>
          </div>
          @if (productStore.sortBy() === 'featured') {
          <i class="bx bxs-check-circle text-xl text-primary-600"></i>
          }
        </button>

        <!-- Price Low to High -->
        <button type="button" (click)="onSortChange('price-asc'); closeFilters()"
          class="flex items-center justify-between w-full py-1.5 px-4 rounded-2xl transition-all duration-200 active:scale-[0.98]"
          [class]="productStore.sortBy() === 'price-asc' ? 'text-primary-700' : 'bg-white border-slate-200 text-slate-700 hover:border-primary-200 hover:bg-slate-50'">
          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-8 h-8 rounded-full"
              [class]="productStore.sortBy() === 'price-asc' ? 'bg-slate-100 text-primary-600' : 'bg-slate-100 text-slate-500'">
              <i class="bx bx-sort-down text-lg"></i>
            </div>
            <span class="font-medium text-[13px]">Harga Terendah</span>
          </div>
          @if (productStore.sortBy() === 'price-asc') {
          <i class="bx bxs-check-circle text-xl text-primary-600"></i>
          }
        </button>

        <!-- Price High to Low -->
        <button type="button" (click)="onSortChange('price-desc'); closeFilters()"
          class="flex items-center justify-between w-full py-1.5 px-4 rounded-2xl transition-all duration-200 active:scale-[0.98]"
          [class]="productStore.sortBy() === 'price-desc' ? 'text-primary-700' : 'bg-white border-slate-200 text-slate-700 hover:border-primary-200 hover:bg-slate-50'">
          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-8 h-8 rounded-full"
              [class]="productStore.sortBy() === 'price-desc' ? 'bg-slate-100 text-primary-600' : 'bg-slate-100 text-slate-500'">
              <i class="bx bx-sort-up text-lg"></i>
            </div>
            <span class="font-medium text-[13px]">Harga Tertinggi</span>
          </div>
          @if (productStore.sortBy() === 'price-desc') {
          <i class="bx bxs-check-circle text-xl text-primary-600"></i>
          }
        </button>

        <!-- Top Rated -->
        <button type="button" (click)="onSortChange('rating'); closeFilters()"
          class="flex items-center justify-between w-full py-1.5 px-4 rounded-2xl transition-all duration-200 active:scale-[0.98]"
          [class]="productStore.sortBy() === 'rating' ? 'text-primary-700' : 'bg-white border-slate-200 text-slate-700 hover:border-primary-200 hover:bg-slate-50'">
          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-8 h-8 rounded-full"
              [class]="productStore.sortBy() === 'rating' ? 'bg-slate-100 text-primary-600' : 'bg-slate-100 text-slate-500'">
              <i class="bx bx-star text-lg"></i>
            </div>
            <span class="font-medium text-[13px]">Rating Tertinggi</span>
          </div>
          @if (productStore.sortBy() === 'rating') {
          <i class="bx bxs-check-circle text-xl text-primary-600"></i>
          }
        </button>
      </div>
    </div>
  </div>
</app-bottom-sheet>
