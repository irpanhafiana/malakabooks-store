<div class="absolute inset-0  flex flex-col">

  @if (cartStore.itemsCount() === 0) {
  <div class="px-4 py-4">
    <app-empty-state icon="shopping-cart" title="Your Cart is Empty"
      description="Looks like you haven't added any items to your cart yet. Explore our publications to find your next great read!"
      actionText="Start Shopping" routerLink="/product"></app-empty-state>
  </div>
  } @else {
  <!-- Scrollable Items Area -->
  <div class="grow overflow-y-auto px-4 pb-4 pt-2 no-scrollbar">
    <div class="flex flex-col gap-1.5">
      @for (item of cartStore.items(); track item.product.id) {
      <div
        class="card-product flex-row! bg-gray-50 border border-slate-100/80 shadow-slate-100/50 hover:shadow-md hover:border-slate-200/80 group flex">
        <!-- Thumbnail Image (matching product-list aspect & styling) -->
        <div class="aspect-square w-32.5 shrink-0 bg-slate-50 overflow-hidden relative cursor-pointer"
          (click)="productStore.setSelectedProductId(item.product.id)">
          <img [src]="item.product.coverImage" [alt]="item.product.title"
            class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105" />
          <div class="badge-uom">{{ item.product.categoryName }}</div>
        </div>

        <!-- Info Section -->
        <div class="flex flex-col flex-1 min-w-0 justify-between px-3 py-3">
          <!-- Top: Category, Title, Price -->
          <div>
            <div class="flex justify-between items-start gap-2">
              <div class="flex-1 min-w-0">
                <span class="text-[10px] font-medium text-slate-400 uppercase tracking-wide block mb-1">{{
                  item.product.categoryName }}</span>
                <h3
                  class="text-[13px] font-semibold text-slate-800 line-clamp-2 mb-1.5 group-hover:text-primary-600 leading-tight cursor-pointer"
                  (click)="productStore.setSelectedProductId(item.product.id)">
                  {{ item.product.title }}</h3>
              </div>
            </div>

            <!-- Price -->
            <div class="flex flex-col mt-0.5">
              <app-price [value]="item.product.price * item.quantity" size="md"
                class="text-primary-600 font-bold"></app-price>
            </div>
          </div>

          <!-- Bottom: Quantity & Delete (matches product pricing row style) -->
          <div class="flex items-center justify-between gap-2">
            <app-quantity-selector [quantity]="item.quantity"
              (quantityChange)="cartStore.updateQuantity(item.product.id, $event)" [stock]="item.product.stock"
              [disabled]="cartStore.loading()" variant="sm"></app-quantity-selector>

            <app-button type="button" [disabled]="cartStore.loading()" (click)="cartStore.removeItem(item.product.id)"
              variant="ghost"
              customClass="text-slate-400 hover:text-rose-500 hover:bg-rose-50 !p-1.5 rounded-lg active:scale-90 disabled:opacity-40">
              <app-icon name="trash" size="16"></app-icon>
            </app-button>
          </div>
        </div>
      </div>
      }
    </div>
  </div>

  <!-- Checkout Summary Card (Natural fixed bottom via flex) -->
  <div
    class="shrink-0 bg-white border-t border-slate-100 p-5 rounded-t-3xl flex flex-col gap-4 z-40 shadow-[0_-15px_30px_-15px_rgba(0,0,0,0.1)]">
    <div class="flex flex-col gap-3.5 text-xs text-slate-500">
      <div class="flex justify-between items-center">
        <h3 class="font-display font-extrabold text-slate-800 text-xs uppercase tracking-wider">Subtotal</h3>
        <app-price [value]="cartStore.subtotal()" [bold]="true" size="md"></app-price>
      </div>

    </div>


    <app-button routerLink="/checkout" variant="primary" size="lg" [fullWidth]="true" class="">
      Proceed to Checkout
    </app-button>
  </div>
  }
</div>
