<div class="absolute inset-0  flex flex-col">

  @if (cartStore.itemsCount() === 0) {
  <div class="px-4 py-4">
    <app-empty-state icon="shopping-cart" title="Your Cart is Empty"
      description="Looks like you haven't added any items to your cart yet. Explore our publications to find your next great read!"
      actionText="Start Shopping" routerLink="/product"></app-empty-state>
  </div>
  } @else {
  <!-- Scrollable Items Area -->
  <div class="grow overflow-y-auto px-4 py-4 no-scrollbar">
    <div class="flex flex-col gap-3">
      @for (item of cartStore.items(); track item.product.id) {
      <div class="flex items-center gap-4 bg-white border border-slate-100 p-4 rounded-2xl  hover:border-slate-200/50">
        <!-- Item Image -->
        <div (click)="productStore.setSelectedProductId(item.product.id)"
          class="h-20 w-16 bg-slate-50 rounded-lg overflow-hidden shrink-0 cursor-pointer relative">
          <img [src]="item.product.coverImage" [alt]="item.product.title" class="object-cover w-full h-full" />
        </div>

        <!-- Details & Remove -->
        <div class="grow flex flex-col">
          <div (click)="productStore.setSelectedProductId(item.product.id)"
            class="text-sm font-semibold text-slate-800 hover:text-primary-600  line-clamp-1 mb-0.5 cursor-pointer">{{
            item.product.title }}</div>
          <span class="text-[10px] text-slate-400 font-semibold mb-1">{{ item.product.categoryName }}</span>
          <div class="flex items-center justify-between mt-1">

            <!-- Quantity editor -->
            <app-quantity-selector [quantity]="item.quantity"
              (quantityChange)="cartStore.updateQuantity(item.product.id, $event)" [stock]="item.product.stock"
              [disabled]="cartStore.loading()" variant="sm"></app-quantity-selector>

            <!-- Price -->
            <div class="flex items-center gap-4">
              <app-price [value]="item.product.price * item.quantity" size="sm" class="text-slate-800"></app-price>
              <app-button type="button" [disabled]="cartStore.loading()" (click)="cartStore.removeItem(item.product.id)"
                variant="ghost"
                customClass="text-slate-400 hover:text-rose-500 hover:bg-rose-50 !p-1.5 rounded-lg active:scale-90 disabled:opacity-40">
                <app-icon name="trash" size="16"></app-icon>
              </app-button>
            </div>
          </div>
        </div>
      </div>
      }
    </div>
  </div>

  <!-- Checkout Summary Card (Natural fixed bottom via flex) -->
  <div
    class="shrink-0 bg-white border-t border-slate-100 p-5 rounded-t-3xl flex flex-col gap-4 z-40 shadow-[0_-15px_30px_-15px_rgba(0,0,0,0.1)]">
    <h3 class="font-display font-extrabold text-slate-800 text-xs uppercase tracking-wider">Order Summary</h3>

    <div class="flex flex-col gap-3.5 text-xs text-slate-500">
      <div class="flex justify-between">
        <span>Subtotal</span>
        <app-price [value]="cartStore.subtotal()" [bold]="false" size="sm"></app-price>
      </div>

    </div>


    <app-button routerLink="/checkout" variant="primary" size="lg" [fullWidth]="true" class="">
      Proceed to Checkout
    </app-button>
  </div>
  }
</div>
