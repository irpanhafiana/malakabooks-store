<div class="px-6 py-8 overflow-y-auto lg:overflow-visible h-full lg:h-auto flex flex-col justify-between no-scrollbar bg-slate-50/30">
  <!-- Top Illustration Area -->
  <div class="flex flex-col items-center text-center mt-4">
    <!-- Stack of Books and Waving Character SVG -->
    <div
      class="w-32 h-32 rounded-full bg-primary-100/70 flex items-center justify-center mb-8 relative border border-primary-200/50 shadow-inner">
      <svg class="w-24 h-24 text-primary-600" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" fill="currentColor" fill-opacity="0.1" />
        <!-- Book spine and base -->
        <rect x="35" y="42" width="30" height="24" rx="2" fill="#337eaf" />
        <rect x="32" y="44" width="36" height="4" rx="1" fill="#ccdfeb" />
        <rect x="32" y="52" width="36" height="4" rx="1" fill="#ccdfeb" />
        <rect x="32" y="60" width="36" height="4" rx="1" fill="#ccdfeb" />
        <!-- Bookmark ribbon -->
        <path d="M48 42 V54 L52 50 L56 54 V42 Z" fill="#F43F5E" />
        <!-- Reading Character Profile -->
        <circle cx="50" cy="30" r="8" fill="currentColor" />
        <path d="M40 42 C40 38 60 38 60 42 V44 H40 V42 Z" fill="currentColor" />
      </svg>
      <!-- Small floating wave hand -->
      <span class="absolute -top-1 -right-1 text-2xl animate-bounce">👋</span>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="text-3xl font-display font-extrabold text-slate-800 tracking-tight leading-tight mb-2">Selamat Datang di Malaka Books</h1>
    <p class="text-slate-500 text-sm font-medium">Jelajahi pengalaman modern yang dibangun untuk kecepatan dan kemudahan.</p>
  </div>

  <!-- Action & Social Buttons Area -->
  <div class="flex flex-col gap-6 mt-8">
    <!-- Primary Get Started Button -->
    <app-button routerLink="/auth/register" [fullWidth]="true" variant="primary" size="lg">
      Mulai Sekarang
    </app-button>

    <!-- Or Divider -->
    <div class="flex items-center gap-3 text-xs font-semibold text-slate-400">
      <div class="h-px grow bg-slate-200/80"></div>
      <span>Atau</span>
      <div class="h-px grow bg-slate-200/80"></div>
    </div>

    <!-- Social Continue Buttons -->
    <div class="flex flex-col gap-3">
      <app-button type="button" variant="outline" size="lg" [fullWidth]="true">
        <div class="flex items-center justify-center gap-3 w-full">
          <i class="bx bxl-google text-lg text-rose-500"></i>
          <span class="font-semibold text-slate-700">Lanjutkan dengan Google</span>
        </div>
      </app-button>

      <app-button type="button" variant="outline" size="lg" [fullWidth]="true">
        <div class="flex items-center justify-center gap-3 w-full">
          <i class="bx bxl-apple text-lg text-slate-900"></i>
          <span class="font-semibold text-slate-700">Lanjutkan dengan Apple</span>
        </div>
      </app-button>

      <app-button type="button" variant="outline" size="lg" [fullWidth]="true">
        <div class="flex items-center justify-center gap-3 w-full">
          <i class="bx bxl-facebook text-lg text-blue-600"></i>
          <span class="font-semibold text-slate-700">Lanjutkan dengan Facebook</span>
        </div>
      </app-button>
    </div>
  </div>

  <!-- Footer Link -->
  <div class="mt-8 text-center text-xs text-slate-500 pb-2">
    <span class="text-slate-500">Sudah punya akun?</span>
    <a routerLink="/auth/login" class="text-primary-600 font-bold hover:text-primary-700 ml-1">Masuk</a>
  </div>
</div>
