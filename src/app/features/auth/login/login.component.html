<div class="animate-fade-in px-4 py-3 h-full flex flex-col justify-center relative no-scrollbar bg-slate-50/30">

  <button type="button" (click)="goBack()"
    class="absolute top-6 left-4 p-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 cursor-pointer active:scale-95 flex items-center justify-center border-0"
    aria-label="Go Back">
    <i class="bx bx-left-arrow-alt text-2xl"></i>
  </button>

  <div class="flex flex-col gap-6 w-full max-w-sm mx-auto">
    <!-- Header Area -->
    <div class="flex flex-col items-center text-center mt-2">
      <div
        class="w-16 h-16 rounded-3xl bg-primary-50 text-primary-600 flex items-center justify-center mb-4 shadow-inner border border-primary-100/50">
        <i class="bx bx-book-open text-3xl"></i>
      </div>
      <h2 class="text-2xl font-display font-extrabold text-slate-800 tracking-tight">Welcome Back!</h2>
      <p class="text-slate-500 text-xs mt-1">Sign in to continue to your account.</p>
    </div>

    <!-- Session Messages -->
    @if (sessionMessage()) {
    <div
      class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200/70 text-xs text-amber-800 font-semibold flex items-start gap-2.5 animate-fade-in shadow-sm shadow-amber-500/5">
      <i class="bx bx-info-circle text-amber-600 text-base mt-0.5"></i>
      <span class="leading-relaxed">{{ sessionMessage() }}</span>
    </div>
    }

    <!-- Main Login Form -->
    <form [formGroup]="loginForm" (submit)="onSubmit()" class="flex flex-col gap-4 mt-2">
      <!-- Email Input -->
      <app-input label="Email" type="text" placeholder="Enter your email" [control]="usernameControl"></app-input>

      <!-- Password Input -->
      <app-input label="Password" type="password" placeholder="Enter your password"
        [control]="passwordControl"></app-input>

      <!-- Options Row -->
      <div class="flex items-center justify-between text-xs mt-1 px-1">
        <app-checkbox label="Remember me" [control]="rememberMeControl"></app-checkbox>
        <a routerLink="/auth/forgot-password" class="text-slate-600 hover:text-primary-600 font-bold ">Forgot
          Password?</a>
      </div>

      <!-- Sign In Button -->
      <app-button type="submit" [loading]="isLoading()" [disabled]="loginForm.invalid" [fullWidth]="true"
        variant="primary" size="lg" class="mt-2">
        Sign In
      </app-button>
    </form>

    <!-- Or Divider -->
    <div class="flex items-center gap-3 text-xs font-semibold text-slate-400 mt-2">
      <div class="h-px grow bg-slate-200/80"></div>
      <span>Or</span>
      <div class="h-px grow bg-slate-200/80"></div>
    </div>

    <!-- Social Logins -->
    <div class="flex items-center justify-center gap-4">
      <app-button type="button" variant="outline" customClass="!rounded-full !w-11 !h-11 !p-0">
        <i class="bx bxl-google text-lg text-rose-500"></i>
      </app-button>
      <app-button type="button" variant="outline" customClass="!rounded-full !w-11 !h-11 !p-0">
        <i class="bx bxl-apple text-lg text-slate-900"></i>
      </app-button>
      <app-button type="button" variant="outline" customClass="!rounded-full !w-11 !h-11 !p-0">
        <i class="bx bxl-facebook text-lg text-blue-600"></i>
      </app-button>
    </div>
  </div>

  <!-- Sign Up Action Footer -->
  <div class="mt-8 text-center text-xs text-slate-500 pb-2">
    <span>Don't have an account? </span>
    <a routerLink="/auth/register" class="text-primary-600 hover:text-primary-700 font-extrabold  cursor-pointer">Sign
      Up</a>
  </div>
</div>
