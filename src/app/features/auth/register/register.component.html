<div class="px-4 py-3 h-full lg:h-auto flex flex-col relative overflow-y-auto lg:overflow-visible no-scrollbar bg-slate-50/30">

  <div class="flex flex-col gap-6 w-full max-w-sm mx-auto my-auto py-4">
    <div class="bg-white border border-slate-100 p-5 rounded-lg flex flex-col gap-6">
      <!-- Top Avatar & Header Area -->
      <div class="flex flex-col items-center text-center">
        <!-- App Logo -->
        <div class="flex items-center gap-2.5 text-slate-800 font-display select-none mb-4">
          <div
            class="px-2.5 py-2 rounded-xl bg-primary-600 flex items-center justify-center h-14 w-14 border border-primary-700 shadow-sm shadow-primary-600/10 shrink-0">
            <img src="/malaka-books.svg" alt="Malaka Books Logo" class="h-22 w-22">
          </div>
          <!-- <div class="flex flex-col justify-center min-w-0 text-left">
            <span class="text-base font-extrabold tracking-tight text-slate-800 leading-tight">Malaka Books</span>
            <span class="font-sans text-[8px] text-slate-400 tracking-wider uppercase leading-none mt-0.5">Jendela
              Literasi Bangsa</span>
          </div> -->
        </div>
        <h2 class="text-2xl font-display font-extrabold text-slate-800 tracking-tight">Buat Akun</h2>
        <p class="text-slate-500 text-xs mt-1">Daftar untuk memulai dengan dasbor Anda.</p>
      </div>

      <!-- Registration Form -->
      <form [formGroup]="registerForm" (submit)="onSubmit()" class="flex flex-col gap-4">
        <!-- Full Name Input -->
        <app-input label="Nama Lengkap" type="text" placeholder="Masukkan nama lengkap" [control]="fullNameControl"></app-input>

        <!-- Phone Number Input -->
        <app-input label="Nomor Telepon" type="tel" placeholder="Masukkan nomor telepon"
          [control]="phoneControl"></app-input>

        <!-- Email Input -->
        <app-input label="Email" type="email" placeholder="Masukkan email Anda" [control]="emailControl"></app-input>

        <!-- Password Input -->
        <app-input label="Kata Sandi" type="password" placeholder="Buat kata sandi"
          [control]="passwordControl"></app-input>

        <!-- Create Account Button -->
        <app-button type="submit" [loading]="isLoading()" [disabled]="registerForm.invalid" [fullWidth]="true"
          variant="primary" size="lg" class="mt-2">
          Buat Akun
        </app-button>
      </form>

      <!-- Or Divider -->
      <div class="flex items-center gap-3 text-xs font-semibold text-slate-400">
        <div class="h-px grow bg-slate-200/80"></div>
        <span>Atau</span>
        <div class="h-px grow bg-slate-200/80"></div>
      </div>

      <!-- Social Logins -->
      <div class="flex items-center justify-center gap-4">
        <app-button type="button" variant="outline" customClass="!rounded-full !w-11 !h-11 !p-0">
          <i class="bx bxl-google text-lg text-rose-500"></i>
        </app-button>
        <app-button type="button" variant="outline" customClass="!rounded-full !w-11 !h-11 !p-0">
          <i class="bx bxl-apple text-lg text-slate-900"></i>
        </app-button>
        <app-button type="button" variant="outline" customClass="!rounded-full !w-11 !h-11 !p-0">
          <i class="bx bxl-facebook text-lg text-blue-600"></i>
        </app-button>
      </div>
    </div>


    <!-- Sign In Action Footer -->
    <div class="mt-8 text-center text-xs text-slate-500 pb-2">
      <span>Sudah punya akun? </span>
      <a routerLink="/auth/login" class="text-primary-600 hover:text-primary-700 font-extrabold  cursor-pointer">Masuk</a>
    </div>
  </div>
