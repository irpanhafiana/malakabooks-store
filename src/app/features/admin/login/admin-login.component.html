<div class="w-full max-w-md mx-auto px-6 lg:px-8 py-12">
  <!-- Header Section -->
  <div class="mb-10">
    <a routerLink="/"
      class="inline-flex items-center gap-2 text-slate-900 font-display font-extrabold text-xl tracking-tight hover:opacity-90 mb-8 select-none">
      <div
        class="px-3 py-3 rounded-xl bg-linear-to-tr from-primary-500 to-primary-600 flex items-center justify-center">
        <img src="/malaka-books.svg" alt="Malaka Books Logo" class="h-6 w-6">
      </div>
      <!-- <span>Malakabooks</span> -->
    </a>

    <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Administrator</h2>
    <p class="text-slate-500 mt-2">Selamat datang kembali! Silakan masuk dengan akun Anda.</p>
  </div>

  <!-- Session Message -->
  @if (sessionMessage()) {
  <div
    class="relative mb-6 p-4 pr-8 rounded-xl bg-red-50 text-sm text-red-800 font-medium text-left animate-fade-in border border-red-100">
    {{ sessionMessage() }}
    <button type="button" (click)="clearSessionMessage()"
      class="absolute top-2 right-2 p-1.5 rounded-lg text-red-500 hover:text-red-800 hover:bg-red-100 transition-colors cursor-pointer">
      <i class='bx bx-x text-lg'></i>
    </button>
  </div>
  }

  <!-- Form Section -->
  <form [formGroup]="loginForm" (submit)="onSubmit()" class="flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-slate-700">Username</label>
      <app-admin-input type="text" placeholder="Enter your username" icon="user"
        [control]="usernameControl"></app-admin-input>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-slate-700">Password</label>
      <app-admin-input type="password" placeholder="Enter your password" icon="cog"
        [control]="passwordControl"></app-admin-input>
    </div>

    <div class="flex items-center justify-between mt-2">
      <div class="flex items-center gap-2">
        <input type="checkbox" id="remember"
          class="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500 cursor-pointer">
        <label for="remember" class="text-sm text-slate-600 cursor-pointer select-none">Remember for 30 days</label>
      </div>
      <a href="#" class="text-sm font-medium text-primary-600 hover:text-primary-500 transition-colors">Forgot
        password</a>
    </div>

    <div class="mt-4">
      <app-admin-button type="submit" [loading]="isLoading()" [disabled]="loginForm.invalid" [fullWidth]="true"
        variant="primary">
        Login
      </app-admin-button>
    </div>
  </form>
</div>
