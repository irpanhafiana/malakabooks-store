<div>
  <h2 class="text-xl font-display font-extrabold text-slate-800 tracking-tight text-center mb-1">Admin Portal Login</h2>
  <p class="text-slate-500 text-xs text-center mb-6">Manage products, categories, orders, and complaints.</p>

  @if (sessionMessage()) {
    <div class="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800 font-semibold text-center animate-fade-in">
      {{ sessionMessage() }}
    </div>
  }

  <form [formGroup]="loginForm" (submit)="onSubmit()" class="flex flex-col gap-4">
    <app-admin-input
      label="Admin Username"
      type="text"
      placeholder="e.g. admin@malakabooks.local"
      icon="user"
      [control]="usernameControl"
    ></app-admin-input>

    <div class="flex flex-col gap-1.5">
      <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Password</label>
      <app-admin-input
        type="password"
        placeholder="e.g. ChangeMe123!"
        icon="cog"
        [control]="passwordControl"
      ></app-admin-input>
    </div>

    <div class="mt-2">
      <app-admin-button
        type="submit"
        [loading]="isLoading()"
        [disabled]="loginForm.invalid"
        [fullWidth]="true"
        variant="primary"
      >
        Access Admin Dashboard
      </app-admin-button>
    </div>
  </form>

  <div class="mt-6 border-t border-slate-100 pt-4 text-center">
    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Demo Credentials:</span>
    <div class="flex flex-col gap-1 mt-2 text-[10px] text-slate-500 font-medium">
      <p>Username: <code class="bg-slate-50 px-1.5 py-0.5 rounded text-primary-600">admin&#64;malakabooks.local</code> / ChangeMe123!</p>
    </div>
  </div>
</div>
