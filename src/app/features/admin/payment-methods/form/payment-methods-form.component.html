<form [formGroup]="paymentForm" class="flex flex-col gap-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-admin-input label="Nama Pembayaran" placeholder="Misal: Bank BCA" [control]="nameControl"></app-admin-input>
    <app-admin-input label="Tipe Metode" placeholder="Misal: transfer_bank" [control]="methodTypeControl"></app-admin-input>
  </div>

  <div class="flex items-center justify-between mt-4">
    <h4 class="text-sm font-bold text-slate-800">Biaya Pembayaran (Fee)</h4>
    <app-admin-button type="button" variant="outline" size="sm" (click)="addFee()">
      <app-icon name="plus" size="14"></app-icon>
      Tambah Fee
    </app-admin-button>
  </div>

  <div formArrayName="fees" class="flex flex-col gap-3">
    @if (feesArray.controls.length === 0) {
      <div class="text-xs text-slate-400 italic text-center p-4 border border-dashed border-slate-200 rounded-xl">
        Belum ada fee yang ditambahkan.
      </div>
    }

    @for (feeForm of feesArray.controls; track $index) {
      <div [formGroupName]="$index" class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col sm:flex-row gap-3 items-start sm:items-center">
        
        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <app-admin-input label="Kode" placeholder="Misal: BIAYA_ADMIN" 
            [control]="$any(feeForm.get('code'))"></app-admin-input>
        </div>

        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <app-admin-input label="Nama" placeholder="Misal: Biaya Admin" 
            [control]="$any(feeForm.get('name'))"></app-admin-input>
        </div>

        <div class="flex flex-col gap-1 w-full sm:w-1/4 pt-1">
          <app-admin-select label="Tipe" 
            [control]="$any(feeForm.get('type'))" [options]="feeTypeOptions"></app-admin-select>
        </div>

        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <app-admin-input label="Nilai" placeholder="Misal: 5000" type="number"
            [control]="$any(feeForm.get('value'))"></app-admin-input>
        </div>

        <button appTooltip="Hapus Data" type="button" (click)="removeFee($index)" 
          class="mt-5 p-2 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-100 transition-colors shrink-0">
          <app-icon name="trash" size="16"></app-icon>
        </button>

      </div>
    }
  </div>

</form>
