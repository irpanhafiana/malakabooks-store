<form [formGroup]="paymentForm" class="flex flex-col gap-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-admin-input label="Payment Name" placeholder="e.g. Bank BCA" [control]="nameControl"></app-admin-input>
    <app-admin-input label="Method Type" placeholder="e.g. bank_transfer" [control]="methodTypeControl"></app-admin-input>
  </div>

  <div class="flex items-center justify-between mt-4">
    <h3 class="font-bold text-slate-700 text-sm">Payment Fees</h3>
    <app-admin-button type="button" variant="outline" size="sm" (click)="addFee()">
      <app-icon name="plus" size="14"></app-icon>
      Tambah Fee
    </app-admin-button>
  </div>

  <div formArrayName="fees" class="flex flex-col gap-3">
    @if (feesArray.controls.length === 0) {
      <div class="text-xs text-slate-400 italic text-center p-4 border border-dashed border-slate-200 rounded-xl">
        Belum ada fee yang ditambahkan.
      </div>
    }

    @for (feeForm of feesArray.controls; track $index) {
      <div [formGroupName]="$index" class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col sm:flex-row gap-3 items-start sm:items-center">
        
        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <label class="text-xs font-semibold text-slate-600">Code</label>
          <input type="text" formControlName="code" placeholder="e.g. ADMIN_FEE" 
            class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-slate-600">
        </div>

        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <label class="text-xs font-semibold text-slate-600">Name</label>
          <input type="text" formControlName="name" placeholder="e.g. Biaya Admin" 
            class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-slate-600">
        </div>

        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <label class="text-xs font-semibold text-slate-600">Type</label>
          <select formControlName="type" 
            class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-slate-600">
            <option value="PERCENTAGE">Percentage (%)</option>
            <option value="FIXED">Fixed (Rp)</option>
          </select>
        </div>

        <div class="flex flex-col gap-1 w-full sm:w-1/4">
          <label class="text-xs font-semibold text-slate-600">Value</label>
          <input type="number" formControlName="value" placeholder="e.g. 5000" 
            class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-slate-600">
        </div>

        <button type="button" (click)="removeFee($index)" 
          class="mt-5 p-2 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-100 transition-colors shrink-0">
          <app-icon name="trash" size="16"></app-icon>
        </button>

      </div>
    }
  </div>

  <div class="flex justify-end gap-2 mt-4">
    <app-admin-button (click)="onCancel.emit()" type="button" variant="outline" size="sm">Batal</app-admin-button>
    <app-admin-button (click)="onSubmitForm()" [disabled]="paymentForm.invalid" type="button" variant="primary"
      size="sm">Simpan Payment</app-admin-button>
  </div>
</form>
