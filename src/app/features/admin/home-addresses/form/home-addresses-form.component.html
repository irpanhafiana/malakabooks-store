<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <app-admin-input
      id="label"
      label="Label Alamat (Contoh: Gudang Jakarta)"
      placeholder="Masukkan label alamat"
      [control]="labelControl"
    ></app-admin-input>
  
    <app-admin-input
      id="recipientName"
      label="Nama Penerima/Kontak"
      placeholder="Masukkan nama penerima"
      [control]="recipientControl"
    ></app-admin-input>
  </div>

  <app-admin-input
    id="phone"
    label="Nomor Telepon"
    placeholder="08xxxxxxxxxx"
    [control]="phoneControl"
    type="tel"
  ></app-admin-input>

  <app-admin-input
    id="street"
    label="Alamat Lengkap (Jalan, No Rumah, RT/RW)"
    placeholder="Masukkan alamat lengkap jalan"
    [control]="streetControl"
  ></app-admin-input>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <app-select
      id="province"
      label="Provinsi"
      [control]="provinceControl"
      [options]="provinceOptions()"
      placeholder="Pilih Provinsi"
    ></app-select>

    <app-select
      id="city"
      label="Kota/Kabupaten"
      [control]="cityControl"
      [options]="cityOptions()"
      placeholder="Pilih Kota"
    ></app-select>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <app-select
      id="district"
      label="Kecamatan"
      [control]="districtControl"
      [options]="districtOptions()"
      placeholder="Pilih Kecamatan"
    ></app-select>

    <app-admin-input
      id="postalCode"
      label="Kode Pos"
      placeholder="Kode Pos"
      [control]="postalCodeControl"
    ></app-admin-input>
  </div>

  <div class="mt-2">
    <label class="block text-sm font-medium text-slate-700 mb-2">Pin Lokasi Peta</label>
    <app-map-picker 
      [initialLat]="selectedLat()" 
      [initialLng]="selectedLng()" 
      (locationSelected)="onMapLocationSelected($event)">
    </app-map-picker>
    <p class="text-xs text-slate-500 mt-2">Klik peta atau geser pin untuk menyesuaikan titik koordinat.</p>
  </div>

  <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-100">
    <app-admin-button type="button" variant="ghost" (click)="handleCancel()">
      Batal
    </app-admin-button>
    <app-admin-button type="submit" variant="primary" [disabled]="form.invalid || isLoading()">
      {{ isLoading() ? 'Menyimpan...' : 'Simpan Alamat' }}
    </app-admin-button>
  </div>
</form>
