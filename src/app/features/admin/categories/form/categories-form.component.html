<form [formGroup]="categoryForm" class="flex flex-col gap-4">
  <app-admin-input label="Nama Kategori" placeholder="Masukkan Nama Kategori ..."
    [control]="nameControl"></app-admin-input>
  <app-admin-input label="Ikon" placeholder="Masukkan Ikon ..." [control]="iconControl"></app-admin-input>

  <div class="flex justify-end gap-2 mt-4">
    <app-admin-button (click)="onCancel.emit()" type="button" variant="outline" size="sm">Batal</app-admin-button>
    <app-admin-button (click)="onSubmitForm()" [disabled]="categoryForm.invalid" type="button" variant="primary"
      size="sm">Simpan Kategori</app-admin-button>
  </div>
</form>
