<div class=" flex flex-col gap-6 pb-20">
  <div class="flex items-center justify-between">
    <h2 class="font-display font-bold text-slate-800 text-xl whitespace-nowrap">{{ isEditing() ? 'Edit Produk' : 'Tambah
      Produk Baru' }}</h2>

    <app-admin-button (click)="onCancel()" variant="outline" size="md" class="shrink-0">
      <app-icon name="chevron-left" size="14"></app-icon>
      Kembali ke Data Produk
    </app-admin-button>

  </div>

  <!-- Form Container -->
  <div class="bg-white p-6 rounded-2xl border border-slate-200">
    <app-products-form [product]="editProduct()" (onCancel)="onCancel()" (onSave)="onSave()">
    </app-products-form>
  </div>
</div>
