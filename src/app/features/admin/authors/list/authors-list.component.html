<div class="animate-fade-in flex flex-col gap-6">

  <!-- Top Action bar -->
  <div class="flex items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200/50 shadow-xs">
    <h2 class="font-display font-bold text-slate-800 text-sm">Authors Manager</h2>

    <app-admin-button (click)="openAddModal()" variant="primary" size="sm">
      <app-icon name="plus" size="14"></app-icon>
      Add Author
    </app-admin-button>
  </div>

  <!-- Data Table -->
  @if (authorStore.loading()) {
  <div class="bg-white rounded-2xl border border-slate-100 shadow-xs">
    <app-spinner text="Loading authors..."></app-spinner>
  </div>
  } @else {
  <app-table>
    <tr table-headers>
      <th class="px-5 py-3">Photo</th>
      <th class="px-5 py-3">Author Name</th>
      <th class="px-5 py-3 text-right">Actions</th>
    </tr>

    <ng-container table-rows>
      @for (auth of pagination.paged(); track auth.id) {
      <tr class="hover:bg-slate-50/30">
        <td class="px-5 py-4">
          @if (auth.photoUrl) {
            <img [src]="auth.photoUrl" alt="{{ auth.name }}" class="w-10 h-10 rounded-full object-cover border border-slate-200">
          } @else {
            <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center border border-slate-200 text-slate-400">
              <app-icon name="user" size="18"></app-icon>
            </div>
          }
        </td>
        <td class="px-5 py-4 font-bold text-slate-800 text-xs">
          {{ auth.name }}
        </td>
        <td class="px-5 py-4 text-right">
          <div class="flex justify-end gap-1.5">
            <button (click)="openEditModal(auth)"
              class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-700 cursor-pointer">
              <app-icon name="edit" size="14"></app-icon>
            </button>
            <button (click)="onDelete(auth.id)"
              class="p-1.5 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-600 cursor-pointer">
              <app-icon name="trash" size="14"></app-icon>
            </button>
          </div>
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="3" class="p-8 text-center text-slate-400">No authors found.</td>
      </tr>
      }
    </ng-container>
  </app-table>

  <app-pagination [currentPage]="pagination.page()" [totalPages]="pagination.totalPages()"
    (pageChange)="pagination.setPage($event)"></app-pagination>
  }

  <!-- Add/Edit Author Modal Form -->
  <app-modal [isOpen]="isModalOpen()" [title]="editAuthor() ? 'Edit Author' : 'Add New Author'">
    <app-authors-form [author]="editAuthor()" (onCancel)="closeModal()" (onSave)="closeModal()">
    </app-authors-form>
  </app-modal>

</div>
