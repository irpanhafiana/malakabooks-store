<div class="flex items-center justify-center min-h-[70vh] px-4">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8">
    <div class="mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-primary-50 mb-4">
        <i class='bx bx-store-alt text-2xl text-primary-600'></i>
      </div>
      <h2 class="text-2xl font-display font-bold text-slate-900 tracking-tight">Masuk Kasir POS</h2>
      <p class="text-slate-500 text-sm mt-2">
        Halaman kasir memakai akun POS Toko Subur Jaya — terpisah dari akun administrator.
      </p>
    </div>

    @if (sessionMessage()) {
    <div class="relative mb-6 p-4 pr-8 rounded-xl bg-red-50 text-sm text-red-800 font-medium border border-red-100">
      {{ sessionMessage() }}
      <button type="button" (click)="clearSessionMessage()"
        class="absolute top-2 right-2 p-1.5 rounded-lg text-red-500 hover:text-red-800 hover:bg-red-100 transition-colors cursor-pointer">
        <i class='bx bx-x text-lg'></i>
      </button>
    </div>
    }

    <form [formGroup]="loginForm" (submit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-slate-700">Nama Pengguna POS</label>
        <app-admin-input type="text" placeholder="Masukkan nama pengguna" icon="user"
          [control]="usernameControl"></app-admin-input>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-slate-700">Kata Sandi</label>
        <app-admin-input type="password" placeholder="Masukkan kata sandi" icon="lock-alt"
          [control]="passwordControl"></app-admin-input>
      </div>

      <div class="mt-2">
        <app-admin-button type="submit" [loading]="isLoading()" [disabled]="loginForm.invalid" [fullWidth]="true"
          variant="primary">
          Masuk Kasir
        </app-admin-button>
      </div>
    </form>
  </div>
</div>
