<!--
  Tata letak dua panel kasir. Berbeda dengan sj-pos yang memakai h-screen +
  padding sendiri, di sini halaman berada di dalam <main> admin-layout yang
  sudah menyediakan padding dan scroll — jadi cukup mengisi tinggi induknya.
-->
<div class="flex flex-col lg:flex-row gap-4 h-full min-h-150 w-full overflow-hidden">
  <!-- PANEL KIRI: Pelanggan & Pencarian -->
  <div class="w-full lg:w-1/3 flex flex-col gap-4 overflow-hidden h-full">
    <app-transaction-customer-card [customerData]="customerData()" [customerSearchQuery]="customerSearchQuery()"
      [customerSearchResults]="customerSearchResults()" [isCustomerInitialLoading]="isCustomerInitialLoading()"
      [customerSelectedIndex]="customerSelectedIndex()" [docDate]="docDate()" [deliveryDate]="deliveryDate()"
      [dueDate]="dueDate()" [creditRestrictionReason]="creditRestrictionReason()"
      (searchQueryChange)="onCustomerSearchChange($event)" (searchKeyDown)="onCustomerKeyDown($event)"
      (customerSelect)="selectCustomer($event)" (bypassClick)="requestBypass()">
    </app-transaction-customer-card>

    <app-transaction-product-search [showPickingPanel]="showPickingPanel()" [searchQueryReady]="searchQueryReady()"
      [searchReadyResults]="searchReadyResults()" [productReadySelectedIndex]="productReadySelectedIndex()"
      [searchQueryPicking]="searchQueryPicking()" [searchPickingResults]="searchPickingResults()"
      [productPickingSelectedIndex]="productPickingSelectedIndex()" [isInitialLoading]="isInitialLoading()"
      (togglePickingPanel)="showPickingPanel.set(!showPickingPanel())" (importB2C)="importB2COrder()"
      (searchReadyChange)="onSearchReadyChange($event)" (searchReadyKeyDown)="onProductReadyKeyDown($event)"
      (selectReadyItem)="selectItem($event.product, true, $event.query)"
      (searchPickingChange)="onSearchPickingChange($event)" (searchPickingKeyDown)="onProductPickingKeyDown($event)"
      (selectPickingItem)="selectItem($event.product, false, $event.query)">
    </app-transaction-product-search>
  </div>

  <!-- PANEL KANAN: Keranjang -->
  <div class="w-full lg:w-2/3 flex flex-col gap-4 overflow-hidden h-full">
    <app-transaction-cart-table [activeRows]="activeRows()" [activeProducts]="activeProducts()"
      [uomColumns]="uomColumns" [inputState]="inputState()" [unitPrices]="unitPrices()"
      [itemReadyState]="itemReadyState()" [loadedSalesOrder]="loadedSalesOrder()" [canTunda]="canTunda()"
      [nonRokokStats]="nonRokokStats()" [isNonRokokBypassed]="isNonRokokBypassed()" [totalBayar]="totalBayar()"
      [customerData]="customerData()" [customerPoints]="customerPoints()" (tundaLagi)="tundaLagi()"
      (executeTunda)="executeTunda()" (resetTransaksi)="resetTransaksi()" (toggleItemReady)="toggleItemReady($event)"
      (updateInputState)="updateInputState($event.rowId, $event.uom, $event.value)"
      (removeProduct)="removeProduct($event)" (requestNonRokokBypass)="requestNonRokokBypass()"
      (openPaymentModal)="isPaymentModalOpen.set(true); focusPaymentInput()" (focusSearch)="focusProductSearch($event)">
    </app-transaction-cart-table>
  </div>
</div>

<app-transaction-payment-modal [isOpen]="isPaymentModalOpen()" [uangDiterima]="uangDiterima()" [remarks]="remarks()"
  [subtotal]="subtotal()" [totalBayar]="totalBayar()" [kembalian]="kembalian()" [customerPoints]="customerPoints()"
  [canProcess]="canProcess()" (closeModal)="isPaymentModalOpen.set(false)"
  (uangDiterimaInput)="onUangDiterimaInput($event)" (remarksChange)="remarks.set($event)"
  (executePembayaran)="executePembayaran($event)">
</app-transaction-payment-modal>

<app-pos-qr-dialog [isOpen]="isQrDialogOpen()" (onProcess)="processQrImport($event)"
  (onClose)="isQrDialogOpen.set(false)">
</app-pos-qr-dialog>
