@if (isOpen()) {
<div class="fixed inset-0 z-modal flex items-center justify-center bg-slate-900/40 backdrop-blur-sm animate-fade-in p-4">
  <div class="absolute inset-0 cursor-pointer" (click)="handleClose()"></div>

  <div
    class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md relative z-10 overflow-hidden animate-slide-up flex flex-col">
    <div
      class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center shrink-0 rounded-t-2xl">
      <div class="flex items-center gap-2.5 pl-1">
        <i class='bx bx-qr text-slate-300 text-3xl'></i>
        <div class="flex flex-col">
          <span class="text-sm font-display font-bold text-slate-700 uppercase tracking-wide">Scan QR dari Customer</span>
          <span class="text-xs text-slate-400">Scan QR untuk melihat keranjangnya</span>
        </div>
      </div>
      <app-pos-button variant="ghost" size="sm" (click)="handleClose()"
        customClass="!w-8 !h-8 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors !p-0">
        <i class='bx bx-x text-2xl'></i>
      </app-pos-button>
    </div>

    <div class="p-5">
      <div #qrInput>
        <app-pos-input type="text" inputId="qr-scan-input" label="QR Code" icon="bx-qr-scan" [ngModel]="inputValue()"
          (ngModelChange)="inputValue.set($event)" (keydown)="onKeyDown($event)" placeholder="Scan QR code disini"
          customClass="font-mono bg-white border-slate-200 focus:border-primary-600">
        </app-pos-input>
      </div>

      <div class="mt-4 flex items-start gap-2 text-xs text-slate-600 bg-rose-50 p-3 rounded-xl border border-rose-100">
        <i class='bx bx-info-circle text-rose-500 text-base'></i>
        <p class="leading-relaxed">Arahkan kursor ke dalam kolom ini dan gunakan scanner fisik Anda, atau ketik UUID
          secara manual lalu tekan Enter.</p>
      </div>
    </div>

    <div class="px-5 py-4 bg-white border-t border-slate-100 flex justify-end gap-3">
      <app-pos-button variant="secondary" size="sm" (click)="handleClose()" label="Batal"></app-pos-button>
      <app-pos-button variant="warning" size="sm" (click)="handleProcess()" [disabled]="!inputValue().trim()"
        icon="bx-check-double" iconClass="text-base" label="Proses"></app-pos-button>
    </div>
  </div>
</div>
}
