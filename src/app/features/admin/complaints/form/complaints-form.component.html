<div class="flex flex-col gap-4">
  <!-- Complaint detail summary -->
  <div class="bg-slate-50 rounded-2xl p-4 text-xs text-slate-700 flex flex-col gap-1.5">
    <p><strong>Subjek:</strong> {{ complaint()?.subject }}</p>
    <p><strong>Deskripsi:</strong> {{ complaint()?.description }}</p>
    <p><strong>Order ID:</strong> {{ complaint()?.orderId }}</p>
  </div>

  <form [formGroup]="respondForm" (ngSubmit)="submitRespond()" class="flex flex-col gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
        Ubah Status
      </label>
      <select
        formControlName="status"
        class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 bg-white focus:outline-none focus:border-primary-400"
      >
        <option value="open">Terbuka</option>
        <option value="in_progress">Diproses</option>
        <option value="resolved">Selesai</option>
        <option value="closed">Ditutup</option>
      </select>
    </div>

    <app-textarea
      label="Respons Admin"
      placeholder="Tulis respons untuk pelanggan..."
      [control]="respondForm.controls.adminResponse"
      [rows]="4"
    ></app-textarea>

    <div class="flex gap-3 pt-1">
      <app-admin-button type="button" variant="outline" class="flex-1" (click)="onCancel.emit()">
        Batal
      </app-admin-button>
      <app-admin-button
        type="submit"
        class="flex-1"
        [disabled]="respondForm.invalid"
        [loading]="submitting()"
      >
        Simpan Respons
      </app-admin-button>
    </div>
  </form>
</div>
