<nav
  class="bg-white/95 backdrop-blur-md flex items-center justify-center gap-2.5 p-1.5 rounded-full overflow-hidden border border-gray-200/80 whitespace-nowrap">

  <!-- Home Item -->
  <a routerLink="/katalog" routerLinkActive="active-item" [routerLinkActiveOptions]="{exact: true}" aria-label="Beranda"
    class="bg-gray-50 border border-gray-100/50 w-14 h-14 flex flex-col items-center justify-center rounded-full group [&.active-item]:bg-primary-600 [&.active-item]:text-white [&.active-item]:border [&.active-item]:border-primary-700 cursor-pointer">
    <i class="bx bx-home-alt-2 text-[18px] group-[.active-item]:scale-95 text-gray-400 group-[.active-item]:text-white"></i>
    <span class="text-[8px] font-medium tracking-tight mt-0.5 leading-none text-gray-400 group-[.active-item]:text-white">Beranda</span>
  </a>

  <!-- Search Item -->
  <a routerLink="/katalog/search" routerLinkActive="active-item" aria-label="Cari produk"
    class="bg-gray-50 border border-gray-100/50 w-14 h-14 flex flex-col items-center justify-center rounded-full group [&.active-item]:bg-primary-600 [&.active-item]:text-white [&.active-item]:border [&.active-item]:border-primary-700 cursor-pointer">
    <i class="bx bx-search text-[18px] group-[.active-item]:scale-95 text-gray-400 group-[.active-item]:text-white"></i>
    <span class="text-[8px] font-medium tracking-tight mt-0.5 leading-none text-gray-400 group-[.active-item]:text-white">Cari</span>
  </a>

  <!-- Cart Item -->
  <a routerLink="/katalog/cart" routerLinkActive="active-item" aria-label="Keranjang"
    class="bg-gray-50 border border-gray-100/50 w-14 h-14 flex flex-col items-center justify-center rounded-full group relative [&.active-item]:bg-primary-600 [&.active-item]:text-white [&.active-item]:border [&.active-item]:border-primary-700 cursor-pointer">
    <div class="relative flex flex-col items-center">
      <i class="bx bx-shopping-bag text-[18px] group-[.active-item]:scale-95 text-gray-400 group-[.active-item]:text-white"></i>
      @if (cartStore.totalItemsCount() > 0) {
      <span
        class="absolute -top-1.5 -right-3 flex items-center justify-center min-w-[15px] h-[15px] px-1 text-[8px] font-bold leading-none text-white bg-rose-500 rounded-full border border-white group-[.active-item]:border-primary-600">
        {{ cartStore.totalItemsCount() }}
      </span>
      }
    </div>
    <span class="text-[8px] font-medium tracking-tight mt-0.5 leading-none text-gray-400 group-[.active-item]:text-white">Keranjang</span>
  </a>

  <!-- Checkout Item -->
  <a routerLink="/katalog/checkout" routerLinkActive="active-item" aria-label="Checkout"
    class="bg-gray-50 border border-gray-100/50 w-14 h-14 flex flex-col items-center justify-center rounded-full group [&.active-item]:bg-primary-600 [&.active-item]:text-white [&.active-item]:border [&.active-item]:border-primary-700 cursor-pointer">
    <i class="bx bx-receipt text-[18px] group-[.active-item]:scale-95 text-gray-400 group-[.active-item]:text-white"></i>
    <span class="text-[8px] font-medium tracking-tight mt-0.5 leading-none text-gray-400 group-[.active-item]:text-white">Checkout</span>
  </a>
</nav>
