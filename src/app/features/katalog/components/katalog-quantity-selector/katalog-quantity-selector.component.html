<div class="flex items-center gap-1.5">
  <button (click)="decrement()" [disabled]="quantity() <= min()" aria-label="Kurangi jumlah"
    [class]="'rounded-lg font-bold border-2 bg-red-200 border-red-400 text-red-600 disabled:opacity-30 active:scale-95 transition-all ' + getButtonClass()">
    <i [class]="'bx bx-minus ' + getIconClass()"></i>
  </button>
  
  <div [class]="'rounded-lg font-bold border-2 border-gray-50 bg-gray-50 text-blue-800 text-center ' + getTextClass()">
    {{ quantity() }}
  </div>

  <button (click)="increment()" [disabled]="quantity() >= max()" aria-label="Tambah jumlah"
    [class]="'rounded-lg font-bold border-2 bg-green-200 border-green-400 text-green-600 disabled:opacity-30 active:scale-95 transition-all ' + getButtonClass()">
    <i [class]="'bx bx-plus ' + getIconClass()"></i>
  </button>
</div>
