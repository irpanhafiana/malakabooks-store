<div class="fixed inset-0 z-150 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-blue-900/40 backdrop-blur-sm transition-opacity duration-300"
    [class.opacity-0]="!show()" [class.opacity-100]="show()" (click)="cancelClick.emit()" (keydown.escape)="cancelClick.emit()" tabindex="0" role="button" aria-label="Close dialog backdrop"></div>

  <!-- Content -->
  <div
    class="relative w-full max-w-sm bg-white rounded-2xl p-8 space-y-6 shadow-2xl transition-all duration-300 ease-out"
    [class.opacity-0]="!show()" [class.scale-95]="!show()" [class.opacity-100]="show()" [class.scale-100]="show()">
    <div class="text-center space-y-2">
      <div [class]="'w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 border ' + getIconBgClass()">
        <i [class]="'bx ' + getIconClass() + ' text-[40px] ' + getIconColorClass()"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 tracking-tight">{{ title() }}</h2>
      <p class="text-sm text-gray-400">
        @if (messageHtml()) {
        <span [innerHTML]="messageHtml()"></span>
        } @else {
        {{ message() }}
        }
      </p>
    </div>

    <div class="flex gap-3">
      <button (click)="cancelClick.emit()"
        class="flex-1 bg-gray-50 border-2 border-gray-100 text-gray-500 rounded-full py-4 px-4 font-bold active:scale-[0.98] transition-all tracking-tight">
        {{ cancelText() }}
      </button>
      <button (click)="confirmClick.emit()"
        [class]="'flex-1 border-3 text-white rounded-full py-4 px-4 font-bold active:scale-[0.98] transition-all tracking-tight ' + getConfirmBtnClass()">
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
