<div class="mx-auto max-w-7xl px-4 py-8 flex items-center justify-center min-h-[calc(100vh-16rem)] text-stone-900 animate-fade-in">
  <div class="relative w-full max-w-sm">
    <!-- Glow Backdrop -->
    <div class="absolute -inset-1 rounded-3xl bg-gradient-to-tr from-amber-600 to-emerald-600 opacity-20 blur-xl pointer-events-none"></div>

    <!-- Card Form -->
    <div class="relative rounded-2xl border border-stone-200 bg-white p-5 shadow-xl space-y-5 text-left">
      
      <!-- Header -->
      <div class="text-center space-y-1">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 text-lg font-extrabold text-white shadow-md mx-auto select-none">M</span>
        <h2 class="text-xl font-extrabold text-stone-900 tracking-tight mt-3">Daftar Akun</h2>
        <p class="text-[11px] text-stone-500">Buat akun untuk berbelanja buku premium</p>
      </div>

      <!-- Form content -->
      <form (submit)="parent().onSubmit()" class="space-y-3.5">
        
        <!-- Name -->
        <app-form-input
          id="name-mobile"
          label="Nama Lengkap"
          type="text"
          [(ngModel)]="parent().name"
          name="name"
          [required]="true"
          placeholder="Budi Santoso"
        ></app-form-input>

        <!-- Email -->
        <app-form-input
          id="email-mobile"
          label="Alamat Email"
          type="email"
          [(ngModel)]="parent().email"
          name="email"
          [required]="true"
          placeholder="budi@gmail.com"
        ></app-form-input>

        <!-- Phone -->
        <app-form-input
          id="phone-mobile"
          label="Nomor Telepon"
          type="tel"
          [(ngModel)]="parent().phone"
          name="phone"
          [required]="true"
          placeholder="081234567890"
        ></app-form-input>

        <!-- Password -->
        <app-form-input
          id="password-mobile"
          label="Kata Sandi"
          type="password"
          [(ngModel)]="parent().password"
          name="password"
          [required]="true"
          placeholder="Min. 6 karakter"
        ></app-form-input>

        <!-- Confirm Password -->
        <app-form-input
          id="confirmPassword-mobile"
          label="Konfirmasi"
          type="password"
          [(ngModel)]="parent().confirmPassword"
          name="confirmPassword"
          [required]="true"
          placeholder="Ulangi kata sandi"
        ></app-form-input>

        <!-- Submit CTA -->
        <div class="pt-2">
          <button
            type="submit"
            [disabled]="parent().isLoading()"
            class="w-full flex items-center justify-center rounded-xl bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 py-3 text-xs font-bold text-white shadow-md active:scale-95 transition-all disabled:opacity-50 cursor-pointer"
          >
            @if (parent().isLoading()) {
              <span>Membuat Akun...</span>
            } @else {
              <span>Daftar Akun</span>
            }
          </button>
        </div>

      </form>

      <!-- Login Link footer -->
      <div class="pt-4 text-center border-t border-stone-150 text-[11px] text-stone-500">
        Sudah memiliki akun? <br/>
        <a routerLink="/login" class="font-bold text-amber-600 hover:underline cursor-pointer block mt-1">Masuk Akun</a>
      </div>

    </div>
  </div>
</div>
