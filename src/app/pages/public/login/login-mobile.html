<div class="mx-auto max-w-7xl px-4 py-12 flex items-center justify-center min-h-[calc(100vh-16rem)] text-stone-900 animate-fade-in">
  <div class="relative w-full max-w-sm">
    <!-- Glow Backdrop -->
    <div class="absolute -inset-1 rounded-3xl bg-gradient-to-tr from-amber-600 to-emerald-600 opacity-20 blur-xl pointer-events-none"></div>

    <!-- Card Form -->
    <div class="relative rounded-2xl border border-stone-200 bg-white p-6 shadow-xl space-y-6 text-left">
      
      <!-- Header -->
      <div class="text-center space-y-1">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 text-lg font-extrabold text-white shadow-md mx-auto select-none">M</span>
        <h2 class="text-xl font-extrabold text-stone-900 tracking-tight mt-3">Selamat Datang</h2>
        <p class="text-[11px] text-stone-500">Masuk ke akun Malaka Books</p>
      </div>

      <!-- Form content -->
      <form (submit)="parent().onSubmit()" class="space-y-4">
        
        <!-- Email -->
        <app-form-input
          id="email-mobile"
          label="Alamat Email"
          type="email"
          [(ngModel)]="parent().email"
          name="email"
          [required]="true"
          placeholder="budi@gmail.com"
        ></app-form-input>

        <!-- Password -->
        <app-form-input
          id="password-mobile"
          label="Kata Sandi"
          type="password"
          [(ngModel)]="parent().password"
          name="password"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- Remember me / simulated forgot -->
        <div class="flex items-center justify-between text-[11px] text-stone-500 pt-1">
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input 
              type="checkbox" 
              [(ngModel)]="parent().rememberMe" 
              name="rememberMe"
              class="rounded bg-white border-stone-200 text-amber-600 focus:ring-0 cursor-pointer" 
            />
            Ingat saya
          </label>
          <span class="text-stone-500 hover:text-amber-500 cursor-help" title="Gunakan budi@gmail.com / password123 atau admin@malakabooks.com / admin123">Bantuan Akun?</span>
        </div>

        <!-- Submit CTA -->
        <div class="pt-2">
          <button
            type="submit"
            [disabled]="parent().isLoading()"
            class="w-full flex items-center justify-center rounded-xl bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 py-3 text-xs font-bold text-white shadow-md active:scale-95 transition-all disabled:opacity-50 cursor-pointer"
          >
            @if (parent().isLoading()) {
              <span>Memverifikasi...</span>
            } @else {
              <span>Masuk Akun</span>
            }
          </button>
        </div>

      </form>

      <!-- Register Link footer -->
      <div class="pt-4 text-center border-t border-stone-150 text-[11px] text-stone-500">
        Belum memiliki akun? <br/>
        <a routerLink="/register" class="font-bold text-amber-600 hover:underline cursor-pointer block mt-1">Daftar Sekarang</a>
      </div>

    </div>
  </div>
</div>
