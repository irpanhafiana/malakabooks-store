<div class="space-y-8 text-left animate-fade-in text-stone-900">
  <!-- Header -->
  <div class="pb-4 border-b border-stone-200">
    <h2 class="text-xl font-bold text-stone-900 tracking-wide">Profil Saya (Desktop View)</h2>
    <p class="text-xs text-stone-500">Kelola informasi profil diri Anda untuk mempermudah transaksi.</p>
  </div>

  <div class="grid grid-cols-12 gap-8 items-start">
    
    <!-- Form Profile (Left Column) -->
    <form (submit)="parent().onSaveProfile()" class="col-span-7 space-y-4">
      <!-- Full Name -->
      <app-form-input
        id="name-desktop"
        label="Nama Lengkap"
        type="text"
        [(ngModel)]="parent().name"
        name="name"
        [required]="true"
        placeholder="Budi Santoso"
      ></app-form-input>

      <!-- Email Address (Disabled) -->
      <div class="space-y-1">
        <app-form-input
          id="email-desktop"
          label="Alamat Email"
          type="email"
          [ngModel]="parent().currentUser()?.email"
          name="email"
          [disabled]="true"
        ></app-form-input>
        <span class="text-[9px] font-medium text-stone-400 block pl-1">Alamat email terdaftar tidak dapat diubah.</span>
      </div>

      <!-- Phone Number -->
      <app-form-input
        id="phone-desktop"
        label="Nomor Telepon"
        type="tel"
        [(ngModel)]="parent().phone"
        name="phone"
        [required]="true"
        placeholder="081234567890"
      ></app-form-input>

      <!-- Submit CTA -->
      <div class="pt-2">
        <button
          type="submit"
          [disabled]="parent().isSavingProfile()"
          class="rounded-xl bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 px-6 py-2.5 text-xs font-bold text-white shadow-md shadow-amber-900/10 active:scale-95 transition-all cursor-pointer disabled:opacity-50"
        >
          @if (parent().isSavingProfile()) {
            <span>Menyimpan...</span>
          } @else {
            <span>Simpan Perubahan</span>
          }
        </button>
      </div>
    </form>

    <!-- Change Password Card (Right Column) -->
    <div class="col-span-5 rounded-2xl border border-stone-200 bg-white p-5 space-y-4 shadow-sm">
      <h3 class="text-xs font-bold text-stone-900 uppercase tracking-wider pb-2 border-b border-stone-100">Ubah Kata Sandi</h3>
      
      <form (submit)="parent().onChangePassword()" class="space-y-3">
        <!-- Current Password -->
        <app-form-input
          id="oldPassword-desktop"
          label="Sandi Lama"
          type="password"
          [(ngModel)]="parent().oldPassword"
          name="oldPassword"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- New Password -->
        <app-form-input
          id="newPassword-desktop"
          label="Sandi Baru"
          type="password"
          [(ngModel)]="parent().newPassword"
          name="newPassword"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- Confirm New Password -->
        <app-form-input
          id="confirmNewPassword-desktop"
          label="Konfirmasi Sandi Baru"
          type="password"
          [(ngModel)]="parent().confirmNewPassword"
          name="confirmNewPassword"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- Submit CTA -->
        <div class="pt-2">
          <button
            type="submit"
            [disabled]="parent().isChangingPassword()"
            class="w-full rounded-xl bg-stone-50 border border-stone-200 hover:bg-stone-100 px-4 py-2 text-xs font-bold text-stone-600 hover:text-stone-900 transition-colors cursor-pointer disabled:opacity-50"
          >
            @if (parent().isChangingPassword()) {
              <span>Memproses...</span>
            } @else {
              <span>Ubah Sandi</span>
            }
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
