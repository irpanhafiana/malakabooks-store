<div class="space-y-6 text-left animate-fade-in text-stone-900 pb-16">
  <!-- Header -->
  <div class="pb-3 border-b border-stone-200">
    <h2 class="text-lg font-bold text-stone-900 tracking-wide">Profil Saya</h2>
    <p class="text-[11px] text-stone-500">Kelola informasi profil diri Anda.</p>
  </div>

  <div class="space-y-6">
    
    <!-- Form Profile -->
    <form (submit)="parent().onSaveProfile()" class="space-y-4">
      <!-- Full Name -->
      <app-form-input
        id="name-mobile"
        label="Nama Lengkap"
        type="text"
        [(ngModel)]="parent().name"
        name="name"
        [required]="true"
        placeholder="Budi Santoso"
      ></app-form-input>

      <!-- Email Address (Disabled) -->
      <div class="space-y-1">
        <app-form-input
          id="email-mobile"
          label="Alamat Email"
          type="email"
          [ngModel]="parent().currentUser()?.email"
          name="email"
          [disabled]="true"
        ></app-form-input>
        <span class="text-[9px] font-medium text-stone-400 block pl-1">Email tidak dapat diubah.</span>
      </div>

      <!-- Phone Number -->
      <app-form-input
        id="phone-mobile"
        label="Nomor Telepon"
        type="tel"
        [(ngModel)]="parent().phone"
        name="phone"
        [required]="true"
        placeholder="081234567890"
      ></app-form-input>

      <!-- Submit CTA -->
      <div class="pt-1">
        <button
          type="submit"
          [disabled]="parent().isSavingProfile()"
          class="w-full rounded-xl bg-gradient-to-r from-amber-600 to-amber-500 py-3 text-xs font-bold text-white shadow-md active:scale-95 transition-all cursor-pointer disabled:opacity-50"
        >
          @if (parent().isSavingProfile()) {
            <span>Menyimpan...</span>
          } @else {
            <span>Simpan Perubahan</span>
          }
        </button>
      </div>
    </form>

    <hr class="border-stone-200" />

    <!-- Change Password Card -->
    <div class="space-y-4">
      <h3 class="text-xs font-bold text-stone-900 uppercase tracking-wider pb-2 border-b border-stone-100">Ubah Kata Sandi</h3>
      
      <form (submit)="parent().onChangePassword()" class="space-y-3">
        <!-- Current Password -->
        <app-form-input
          id="oldPassword-mobile"
          label="Sandi Lama"
          type="password"
          [(ngModel)]="parent().oldPassword"
          name="oldPassword"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- New Password -->
        <app-form-input
          id="newPassword-mobile"
          label="Sandi Baru"
          type="password"
          [(ngModel)]="parent().newPassword"
          name="newPassword"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- Confirm New Password -->
        <app-form-input
          id="confirmNewPassword-mobile"
          label="Konfirmasi Sandi Baru"
          type="password"
          [(ngModel)]="parent().confirmNewPassword"
          name="confirmNewPassword"
          [required]="true"
          placeholder="••••••••"
        ></app-form-input>

        <!-- Submit CTA -->
        <div class="pt-1">
          <button
            type="submit"
            [disabled]="parent().isChangingPassword()"
            class="w-full rounded-xl bg-stone-50 border border-stone-200 hover:bg-stone-100 py-2.5 text-xs font-bold text-stone-600 active:scale-95 transition-all cursor-pointer disabled:opacity-50"
          >
            @if (parent().isChangingPassword()) {
              <span>Memproses...</span>
            } @else {
              <span>Ubah Sandi</span>
            }
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
