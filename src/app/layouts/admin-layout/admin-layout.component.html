<div class="min-h-screen bg-slate-100 flex flex-col md:flex-row relative">
  <!-- Mobile Top Bar -->
  <header class="md:hidden bg-slate-900 text-white flex items-center justify-between px-4 py-3.5 z-40 shadow-md">
    <a routerLink="/" class="flex items-center gap-2 font-display font-extrabold text-base tracking-tight">
      <div class="px-1.5 py-1 rounded bg-primary-600 flex items-center justify-center h-6 w-6">
        <img src="/malaka-books.svg" alt="Malaka Books Logo" class="h-3.5 w-3.5">
      </div>
      malakabooks
    </a>
    <button
      type="button"
      (click)="toggleSidebar()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isSidebarOpen()"
      class="p-1 rounded hover:bg-slate-800 transition-colors cursor-pointer"
    >
      <app-icon name="menu" size="20" class="text-white"></app-icon>
    </button>
  </header>

  <!-- Sidebar Area -->
  <aside
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
    class="fixed md:static inset-y-0 left-0 w-64 bg-slate-950 text-slate-300 z-50 flex flex-col justify-between transition-transform duration-300 md:translate-x-0 shadow-xl h-screen md:h-auto"
  >
    <div>
      <!-- Sidebar Brand Header -->
      <div class="p-5 border-b border-slate-900 hidden md:block">
        <a routerLink="/" class="flex items-center gap-2.5 text-white font-display font-extrabold text-xl tracking-tight select-none">
          <div class="px-2 py-1.5 rounded-xl bg-linear-to-tr from-primary-500 to-rose-600 shadow-md shadow-primary-500/10 flex items-center justify-center h-9 w-9">
            <img src="/malaka-books.svg" alt="Malaka Books Logo" class="h-5.5 w-5.5">
          </div>
          malakabooks
        </a>
      </div>

      <!-- Navigation Links -->
      <nav class="p-4 flex flex-col gap-1.5">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mb-2 block">Management</span>

        <a
          routerLink="/admin"
          [routerLinkActiveOptions]="{exact: true}"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="dashboard" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Dashboard
        </a>

        <a
          routerLink="/admin/products"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="book-open" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Products
        </a>

        <a
          routerLink="/admin/categories"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="filter" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Categories
        </a>

        <a
          routerLink="/admin/orders"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="shopping-bag" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Orders
        </a>

        <a
          routerLink="/admin/users"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="users" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Users
        </a>

        <a
          routerLink="/admin/complaints"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="message-square" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Complaints
        </a>

        <a
          routerLink="/admin/reports"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="bar-chart" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Reports
        </a>

        <a
          routerLink="/admin/home-addresses"
          routerLinkActive="bg-primary-600/10 text-primary-500 border-l-4 border-primary-500 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer border-l-4 border-transparent"
        >
          <app-icon name="map-pin" size="18" class="text-slate-400 group-hover:text-primary-500"></app-icon>
          Toko Addresses
        </a>
      </nav>
    </div>

    <!-- Sidebar footer area -->
    <div class="p-4 border-t border-slate-900 flex flex-col gap-2 bg-slate-950/60">
      <a
        routerLink="/"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-sm group cursor-pointer"
      >
        <app-icon name="home" size="18" class="text-slate-400 group-hover:text-white"></app-icon>
        Back to Shop
      </a>
      <button
        (click)="onSignOut()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-rose-950/20 text-rose-400 hover:text-rose-300 transition-all text-sm group text-left cursor-pointer"
      >
        <app-icon name="log-out" size="18" class="text-rose-400/80 group-hover:text-rose-300"></app-icon>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Sidebar Backdrop overlay for mobile screen sizes -->
  @if (isSidebarOpen()) {
    <div
      class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 md:hidden transition-opacity"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Main Dashboard Content viewport -->
  <div class="flex-1 flex flex-col overflow-x-hidden min-h-screen">
    <!-- Top Navbar (Desktop only) -->
    <header class="bg-white border-b border-slate-200/60 h-16 hidden md:flex items-center justify-between px-6 shadow-xs">
      <!-- Left side: Breadcrumb tracker -->
      <div class="flex items-center gap-2 text-xs font-semibold text-slate-500">
        <span>Admin</span>
        <app-icon name="chevron-right" size="12" class="text-slate-400"></app-icon>
        <span class="text-slate-800 capitalize font-bold text-sm">{{ activeRouteName() }}</span>
      </div>

      <!-- Right side: Profile indicator -->
      <div class="flex items-center gap-3">
        <span class="text-xs text-slate-400">Logged in as <strong class="text-slate-800 font-semibold">{{ authStore.currentUser()?.name }}</strong></span>
        <div class="h-8 w-8 rounded-full bg-primary-50 text-primary-700 font-extrabold flex items-center justify-center border border-primary-100 text-xs">
          {{ authStore.currentUser()?.name?.substring(0, 2)?.toUpperCase() }}
        </div>
      </div>
    </header>

    <!-- Main Dashboard content body -->
    <main class="grow p-6">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global toast outlet (previously missing in admin → silent failures) -->
  <app-toast-container></app-toast-container>
</div>
