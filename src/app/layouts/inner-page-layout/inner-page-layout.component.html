<div class="inner-root min-h-screen bg-slate-50 flex flex-col">
  @if (screen.isDesktop()) {
  <app-desktop-header></app-desktop-header>

  <main class="grow max-w-6xl w-full mx-auto px-6 py-6 min-h-[60vh] relative">
    <router-outlet></router-outlet>
  </main>

  <app-desktop-footer></app-desktop-footer>
  <app-toast-container></app-toast-container>

  } @else {
  <!-- MOBILE SHELL -->
  <div class="h-dvh w-full bg-slate-50 flex justify-center overflow-hidden inner-root"
    style="padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);">

    <!-- Mobile App Frame Container (Constrained width, clamp scaling, with simulator borders) -->
    <div
      class="w-full max-w-[480px] bg-slate-50 relative flex flex-col md:border-x md:border-slate-200/60 md:shadow-2xl md:shadow-[0_0_40px_-10px_rgba(0,0,0,0.1)] overflow-hidden"
      style="height: calc(100% / clamp(0.5, 100vw / 480, 1)); transform: scale(clamp(0.5, 100vw / 480, 1)); transform-origin: center top;">

      <!-- Header with Back Button -->
      @if (!hideHeader()) {
      <header class="sticky top-0 z-40 bg-slate-50 px-4 py-3 flex items-center gap-2 h-14 shrink-0">
        <button type="button" (click)="goBack()"
          class="p-2 -ml-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 cursor-pointer active:scale-95 flex items-center justify-center border-0 "
          aria-label="Go Back">
          <i class="bx bx-left-arrow-alt text-2xl"></i>
        </button>

        @if (pageTitle()) {
        <h1 class="font-display font-extrabold text-slate-800 text-base flex-1 truncate">{{ pageTitle() }}</h1>
        }
      </header>
      }

      <!-- Main Content Area (No scrolling here, children must handle it) -->
      <main class="grow flex flex-col bg-slate-50 relative overflow-hidden z-50">
        <div #routeContainer class="w-full h-full flex flex-col grow relative">
          <router-outlet></router-outlet>
        </div>
      </main>

      <!-- Global Toasts Alert Overlay -->
      <app-toast-container></app-toast-container>

    </div>
  </div>
  }
</div>
