<header class="sticky top-0 z-40 bg-white border-b border-slate-200/60 shadow-sm w-full">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-8">
    
    <!-- Left: Brand Logo & Links -->
    <div class="flex items-center gap-8 shrink-0">
      <!-- Logo -->
      <a routerLink="/" (click)="resetFilters()" class="flex items-center gap-3 text-slate-800 font-display select-none">
        <div class="px-2 py-1.5 rounded-lg bg-primary-600 flex items-center justify-center h-10 w-10 border border-primary-700 shadow-sm shadow-primary-600/10 shrink-0">
          <img src="/malaka-books.svg" alt="Malaka Books Logo" class="h-7 w-7">
        </div>
        <div class="flex flex-col justify-center min-w-0">
          <span class="text-xl font-extrabold tracking-tight text-slate-800 leading-tight">Malaka Books</span>
          <span class="font-sans text-[10px] text-slate-400 tracking-wider uppercase leading-none mt-0.5">Jendela Literasi Bangsa</span>
        </div>
      </a>

      <!-- Navigation Links -->
      <nav class="flex items-center gap-1 font-medium text-sm text-slate-600">
        <a routerLink="/" routerLinkActive="text-primary-600 font-bold bg-slate-50" [routerLinkActiveOptions]="{exact: true}" (click)="resetFilters()" class="px-4 py-2 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">Beranda</a>
        <a routerLink="/product" routerLinkActive="text-primary-600 font-bold bg-slate-50" class="px-4 py-2 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">Produk</a>
        <a routerLink="/mardika-kopi" routerLinkActive="text-primary-600 font-bold bg-slate-50" class="px-4 py-2 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">Mardika Kopi</a>
      </nav>
    </div>

    <!-- Center: Search Bar -->
    <div class="flex-1 max-w-2xl">
      <app-search-bar [placeholder]="'Cari judul buku, penulis, atau penerbit...'" [value]="productStore.searchQuery()" (search)="onSearch($event)"></app-search-bar>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2 shrink-0">
      @if (authStore.isLoggedIn()) {
        <!-- Cart -->
        <a routerLink="/cart" aria-label="Keranjang" class="p-2.5 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-primary-600 cursor-pointer active:scale-95 flex items-center justify-center border-0 bg-transparent transition-colors relative">
          <i class="bx bx-shopping-bag text-2xl"></i>
          @if (cartStore.itemsCount() > 0) {
            <span class="absolute top-1.5 right-1.5 flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[10px] font-bold leading-none text-white bg-rose-500 rounded-full border-2 border-white">
              {{ cartStore.itemsCount() }}
            </span>
          }
        </a>

        <!-- Profile -->
        <a routerLink="/profile" class="flex items-center gap-2 p-1.5 pr-4 rounded-full border border-slate-200 hover:bg-slate-50 transition-colors ml-2">
          <div class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center text-primary-600">
            <i class="bx bx-user text-lg"></i>
          </div>
          <span class="text-sm font-semibold text-slate-700">Akun Saya</span>
        </a>
      } @else {
        <a routerLink="/auth/login" class="px-5 py-2.5 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-100 transition-colors">Masuk</a>
        <a routerLink="/auth/register" class="px-5 py-2.5 rounded-lg text-sm font-bold text-white bg-primary-600 hover:bg-primary-700 transition-colors shadow-sm">Daftar</a>
      }
    </div>
    
  </div>
</header>
