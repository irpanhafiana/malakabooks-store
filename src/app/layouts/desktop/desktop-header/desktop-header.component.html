<header class="fixed top-0 z-50 bg-slate-50 w-full">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between gap-8">

    <!-- Left: Brand Logo -->
    <div class="flex items-center gap-8 shrink-0">
      <!-- Logo -->
      <a routerLink="/" (click)="resetFilters()"
        class="flex items-center gap-2.5 text-slate-900 select-none group">
        <img src="/logo/malakabooks-logo.svg" alt="Malakabooks Logo" class="h-9 w-auto object-contain transition-transform group-hover:scale-105" />
        <div class="flex flex-col">
          <span class="font-display font-black text-lg tracking-tight text-slate-900 leading-none">malakabooks</span>
          <span class="text-[9px] font-semibold tracking-wider text-slate-700 uppercase leading-tight">Toko Buku Fisik</span>
        </div>
      </a>
    </div>

    <!-- Center: Navigation Links -->
    <nav class="hidden lg:flex flex-1 justify-center items-center gap-2 text-lg font-semibold text-slate-600">
      <a routerLink="/" routerLinkActive="text-slate-700 font-bold bg-slate-100"
        [routerLinkActiveOptions]="{exact: true}" (click)="resetFilters()"
        class="px-4 py-2 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">Beranda</a>
      <a routerLink="/product" routerLinkActive="text-slate-700 font-bold bg-slate-100"
        (click)="resetFilters()"
        class="px-4 py-2 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">Koleksi Buku</a>
      <a href="https://malakabooks.id" target="_blank" rel="noopener noreferrer"
        class="px-4 py-2 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors inline-flex items-center gap-1 text-slate-500">
        <span>malakabooks.id</span>
        <i class="bx bx-link-external text-xs text-slate-400"></i>
      </a>
    </nav>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2 shrink-0">
      @if (authStore.isLoggedIn()) {
      <!-- Cart -->
      <a routerLink="/cart" aria-label="Keranjang"
        class="p-2.5 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700 cursor-pointer active:scale-95 flex items-center justify-center border-0 bg-transparent transition-colors relative">
        <i class="bx bx-shopping-bag text-2xl"></i>
        @if (cartStore.itemsCount() > 0) {
        <span
          class="absolute top-1.5 right-1.5 flex items-center justify-center min-w-4.5 h-4.5 px-1 text-[10px] font-bold leading-none text-white bg-rose-500 rounded-full border-2 border-white">
          {{ cartStore.itemsCount() }}
        </span>
        }
      </a>

      <!-- Profile -->
      <a routerLink="/profile"
        class="flex items-center gap-2 p-1.5 pr-4 rounded-full border border-slate-200 hover:bg-slate-50 transition-colors ml-2">
        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-700">
          <i class="bx bx-user text-lg"></i>
        </div>
        <span class="text-sm font-semibold text-slate-700">Akun Saya</span>
      </a>
      } @else {
      <a [href]="loginUrl"
        class="px-6 py-2.5 rounded-full text-sm font-bold text-white bg-slate-700 hover:bg-slate-800 transition-colors uppercase tracking-wider inline-flex items-center gap-2">
        <span>Masuk</span>
        <i class="bx bx-log-in-circle text-lg"></i>
      </a>
      }
    </div>

  </div>
</header>
