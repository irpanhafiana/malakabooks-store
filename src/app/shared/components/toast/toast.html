<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none max-w-sm w-full px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="bg-stone-900/95 border border-stone-800 text-stone-100 flex items-start gap-3 rounded-xl p-4 shadow-xl backdrop-blur-md pointer-events-auto animate-slide-in relative overflow-hidden"
    >
      <!-- Accent Line animation -->
      <div 
        [ngClass]="{
          'bg-emerald-600': toast.type === 'success',
          'bg-amber-500': toast.type === 'error',
          'bg-primary': toast.type === 'info'
        }"
        class="absolute bottom-0 left-0 h-1 animate-shrink-width"
        [style.animation-duration]="(toast.duration || 3000) + 'ms'"
      ></div>

      <!-- Icons -->
      @if (toast.type === 'success') {
        <svg class="h-5 w-5 shrink-0 text-emerald-600 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      } @else if (toast.type === 'error') {
        <svg class="h-5 w-5 shrink-0 text-amber-500 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      } @else {
        <svg class="h-5 w-5 shrink-0 text-primary mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      }

      <div class="flex-1 text-xs font-semibold pr-4 leading-snug">
        {{ toast.message }}
      </div>

      <!-- Close button -->
      <button
        (click)="toastService.dismiss(toast.id)"
        class="text-stone-400 hover:text-stone-200 transition-colors shrink-0 cursor-pointer"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
