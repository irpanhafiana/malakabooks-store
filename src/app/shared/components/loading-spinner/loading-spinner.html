@if (type === 'spinner') {
  <!-- Classic spinner -->
  <div class="flex flex-col items-center justify-center py-12 gap-3">
    <div class="h-10 w-10 animate-spin rounded-full border-4 border-stone-200 border-t-amber-600"></div>
    @if (message) {
      <p class="text-xs font-medium text-stone-500">{{ message }}</p>
    }
  </div>
} @else {
  <!-- Premium skeleton loader for lists or grids -->
  <div [ngClass]="{
    'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6': layout === 'grid',
    'space-y-4': layout === 'list'
  }" class="w-full">
    @for (item of skeletonItems(); track $index) {
      @if (layout === 'grid') {
        <!-- Card Skeleton -->
        <div class="animate-pulse rounded-2xl border border-stone-200 bg-stone-100/50 p-4 space-y-4">
          <div class="aspect-[3/4] w-full rounded-xl bg-stone-200"></div>
          <div class="h-3 w-1/4 rounded bg-stone-200"></div>
          <div class="h-4 w-3/4 rounded bg-stone-200"></div>
          <div class="h-3.5 w-1/2 rounded bg-stone-200"></div>
          <div class="flex items-center justify-between pt-2">
            <div class="h-4 w-1/3 rounded bg-stone-200"></div>
            <div class="h-3.5 w-1/4 rounded bg-stone-200"></div>
          </div>
        </div>
      } @else {
        <!-- List Item Skeleton -->
        <div class="animate-pulse flex items-center gap-4 rounded-xl border border-stone-200 bg-stone-100/50 p-4 w-full">
          <div class="h-16 w-12 rounded bg-stone-200 shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 w-1/3 rounded bg-stone-200"></div>
            <div class="h-3 w-1/4 rounded bg-stone-200"></div>
          </div>
          <div class="h-6 w-16 rounded bg-stone-200 shrink-0"></div>
        </div>
      }
    }
  </div>
}
