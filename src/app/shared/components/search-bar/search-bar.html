<form (submit)="onSubmit()" class="relative flex w-full items-center">
  <input
    type="text"
    [(ngModel)]="query"
    name="searchQuery"
    [placeholder]="placeholder"
    class="w-full rounded-full bg-white border border-stone-200 px-5 py-3 pl-12 text-sm text-stone-900 placeholder-stone-400 focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600 shadow-sm transition-all duration-300"
  />
  <svg class="absolute left-4.5 h-5 w-5 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
  </svg>
  @if (query) {
    <button
      type="button"
      (click)="clear()"
      class="absolute right-4 p-1 text-stone-400 hover:text-stone-700 transition-colors"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  }
</form>
