<div class="rounded-3xl border border-stone-200 bg-white p-8 sm:p-12 text-center max-w-md mx-auto my-6 select-none shadow-lg w-full">
  <!-- Icon Wrapper -->
  <div class="h-16 w-16 mx-auto flex items-center justify-center rounded-2xl bg-stone-100 text-stone-500 mb-5 border border-stone-200 shadow-md">

    @if (icon === 'cart') {
      <svg class="h-8 w-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg>
    } @else if (icon === 'search') {
      <svg class="h-8 w-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    } @else if (icon === 'orders') {
      <svg class="h-8 w-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2" />
      </svg>
    } @else if (icon === 'address') {
      <svg class="h-8 w-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    }
  </div>

  <!-- Text -->
  <h3 class="text-sm font-bold text-stone-900 mb-1.5 uppercase tracking-wider">{{ title }}</h3>
  <p class="text-xs text-stone-500 leading-relaxed max-w-xs mx-auto">{{ message }}</p>

  <!-- Action button -->
  @if (actionText) {
    <div class="mt-6">
      @if (actionLink) {
        <a
          [routerLink]="[actionLink]"
          [queryParams]="actionParams"
          class="rounded-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white text-xs font-bold px-6 py-2.5 inline-block hover:scale-[1.02] active:scale-95 transition-all shadow-md shadow-amber-900/10 cursor-pointer"
        >
          {{ actionText }}
        </a>
      } @else {
        <button
          type="button"
          (click)="onAction()"
          class="rounded-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white text-xs font-bold px-6 py-2.5 inline-block hover:scale-[1.02] active:scale-95 transition-all shadow-md shadow-amber-900/10 cursor-pointer"
        >
          {{ actionText }}
        </button>
      }
    </div>
  }
</div>
