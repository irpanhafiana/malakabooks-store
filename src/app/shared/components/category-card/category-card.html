<a
  [routerLink]="['/catalog']"
  [queryParams]="{category: category.id}"
  class="group relative flex flex-col p-6 rounded-2xl border border-stone-200 bg-white hover:bg-stone-50 hover:border-amber-500/50 hover:shadow-xl transition-all duration-300 text-left overflow-hidden select-none"
>
  <!-- Glow backdrop on hover -->
  <div class="absolute -inset-1 rounded-2xl bg-gradient-to-tr from-amber-600/5 to-emerald-600/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>

  <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-stone-100 border border-stone-200 text-amber-500 group-hover:bg-gradient-to-tr group-hover:from-amber-600 group-hover:to-amber-500 group-hover:text-white transition-all duration-300 mb-4 shadow-sm group-hover:scale-105">
    <!-- Category Icon representation -->
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
    </svg>
  </div>

  <h3 class="text-sm font-bold text-stone-900 group-hover:text-amber-500 transition-colors mb-1 truncate">
    {{ category.name }}
  </h3>
  <p class="text-[11px] text-stone-500 leading-snug line-clamp-2">
    {{ category.description }}
  </p>
</a>
