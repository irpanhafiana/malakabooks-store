<span
  [ngClass]="[
    'inline-flex items-center justify-center border font-bold uppercase tracking-wider select-none leading-none shrink-0',
    size === 'xs' ? 'px-2 py-0.5 text-[9px] rounded' : '',
    size === 'sm' ? 'px-2.5 py-0.5 text-[10px] rounded-md' : '',
    type === 'success' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-500' : '',
    type === 'warning' ? 'bg-orange-500/10 border-orange-500/20 text-orange-400' : '',
    type === 'danger' ? 'bg-red-500/10 border-red-500/20 text-red-400' : '',
    type === 'info' ? 'bg-sky-500/10 border-sky-500/20 text-sky-400' : '',
    type === 'neutral' ? 'bg-stone-100 border-stone-200 text-stone-600' : ''
  ]"
>
  <ng-content></ng-content>
</span>
