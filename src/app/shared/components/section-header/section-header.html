<div class="flex items-end justify-between border-b border-stone-200 pb-5 select-none w-full">
  <div class="space-y-1 text-left">
    <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight text-stone-900">
      {{ title }}
    </h2>
    @if (description) {
      <p class="text-[11px] sm:text-xs text-stone-500 font-light">
        {{ description }}
      </p>
    }
  </div>

  @if (actionText && actionLink) {
    <a
      [routerLink]="[actionLink]"
      [queryParams]="actionParams"
      class="text-xs font-bold text-amber-500 hover:text-amber-400 transition-colors flex items-center gap-1.5 shrink-0"
    >
      {{ actionText }}
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>
  }
</div>
