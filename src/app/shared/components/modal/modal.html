@if (isOpen) {
  <div
    (click)="onBackdropClick($event)"
    class="fixed inset-0 z-[999] flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-0 sm:p-4 animate-fade-in"
  >
    <div
      [ngClass]="[
        'w-full bg-white text-stone-900 border-stone-200 z-[1000] flex flex-col overflow-hidden shadow-2xl relative',
        'rounded-t-3xl border-t p-6 max-h-[85vh] animate-slide-in',
        'sm:rounded-2xl sm:border sm:p-6 sm:max-h-[90vh] sm:animate-none sm:bottom-auto sm:left-auto sm:right-auto',
        size === 'sm' ? 'sm:max-w-sm' : '',
        size === 'md' ? 'sm:max-w-md' : '',
        size === 'lg' ? 'sm:max-w-lg' : '',
        size === 'xl' ? 'sm:max-w-xl' : ''
      ]"
    >
      <!-- Modal Drag Indicator for Mobile Sheet -->
      <div class="sm:hidden flex justify-center mb-4 shrink-0">
        <div class="h-1.5 w-12 rounded-full bg-stone-300"></div>
      </div>

      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-4 border-b border-stone-200 shrink-0 select-none">
        <h3 class="text-sm font-bold text-stone-900 uppercase tracking-wider">
          {{ title }}
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="p-1 rounded-lg text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition-all cursor-pointer"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="flex-1 overflow-y-auto py-4 text-xs pr-1">
        <ng-content select="[body]"></ng-content>
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-stone-200 shrink-0">
        <ng-content select="[footer]"></ng-content>
      </div>
    </div>
  </div>
}
