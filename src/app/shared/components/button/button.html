<button
  [type]="type"
  [disabled]="disabled || loading"
  [ngClass]="[
    'inline-flex items-center justify-center font-bold rounded-xl transition-all duration-200 select-none focus:outline-none cursor-pointer',
    size === 'sm' ? 'px-3 py-1.5 text-[11px] rounded-lg' : '',
    size === 'md' ? 'px-5 py-2.5 text-xs' : '',
    size === 'lg' ? 'px-7 py-3 text-sm' : '',
    variant === 'primary' ? 'bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white shadow-lg shadow-amber-500/20 active:scale-[0.98]' : '',
    variant === 'secondary' ? 'bg-white border border-stone-200 hover:bg-stone-50 text-stone-700 hover:text-stone-900 active:scale-[0.98]' : '',
    variant === 'danger' ? 'bg-red-50 border border-red-200 hover:bg-red-100 text-red-600 hover:text-red-700 active:scale-[0.98]' : '',
    variant === 'ghost' ? 'text-stone-500 hover:bg-stone-100 hover:text-stone-900' : '',
    fullWidth ? 'w-full' : 'w-auto',
    (disabled || loading) ? 'opacity-50 cursor-not-allowed pointer-events-none scale-100' : '',
    customClass
  ]"
>
  @if (loading) {
    <svg class="animate-spin -ml-1 mr-2 h-3.5 w-3.5 text-current" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  }
  <ng-content></ng-content>
</button>
