<div class="flex flex-col gap-2.5">
  @if (label()) {
  <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">{{ label() }}</span>
  }
  <div [class]="directionClass()">
    @for (opt of options(); track opt.value) {
    <label class="inline-flex items-center gap-3 cursor-pointer select-none group">
      <div class="relative flex items-center">
        <input type="radio" [name]="name()" [value]="opt.value" [formControl]="control()" class="peer sr-only" />
        <!-- Custom radio selector outer ring and inner dot -->
        <div
          class="h-5 w-5 rounded-full border border-slate-200 bg-white  peer-checked:border-primary-600 flex items-center justify-center peer-focus-visible:ring-2 peer-focus-visible:ring-primary-500/30">
          <div class="h-2.5 w-2.5 rounded-full bg-primary-600 scale-0 peer-checked:scale-100  ">
          </div>
        </div>
      </div>
      <span class="text-sm text-slate-600 group-hover:text-slate-800 ">{{ opt.label }}</span>
    </label>
    }
  </div>
</div>
