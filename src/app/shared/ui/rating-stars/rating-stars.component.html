<div class="flex items-center gap-1">
  <div class="flex items-center gap-0.5 text-amber-400">
    @for (star of stars(); track $index) {
      @if (star === 'full') {
        <app-icon name="star" [size]="starSize()" class="text-amber-400 fill-amber-400"></app-icon>
      } @else if (star === 'half') {
        <app-icon name="star-half" [size]="starSize()" class="text-amber-400 fill-amber-400"></app-icon>
      } @else {
        <app-icon name="star" [size]="starSize()" class="text-slate-200"></app-icon>
      }
    }
  </div>
  @if (showText()) {
    <span class="text-xs font-semibold text-slate-700 ml-0.5">{{ rating() }}</span>
    @if (reviewsCount() !== undefined) {
      <span class="text-[10px] text-slate-400">({{ reviewsCount() }}{{ reviewsSuffix() }})</span>
    }
  }
</div>
