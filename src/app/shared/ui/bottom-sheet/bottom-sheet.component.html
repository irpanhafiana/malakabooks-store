@if (renderComponent()) {
  <!-- Backdrop overlay -->
  <div
    class="absolute inset-0 bg-slate-900/50 backdrop-blur-[2px] z-40 transition-opacity duration-300 ease-in-out"
    [class.opacity-100]="isAnimating()"
    [class.opacity-0]="!isAnimating()"
    (click)="closeSheet()"
  ></div>

  <!-- Bottom Sheet Content Container -->
  <div
    class="absolute bottom-0 left-0 right-0 max-h-[90%] bg-white rounded-t-[32px] border-t border-slate-200/85 z-50 flex flex-col overflow-hidden transition-transform duration-300 ease-out transform"
    [class.translate-y-0]="isAnimating()"
    [class.translate-y-full]="!isAnimating()"
  >
    <!-- Drag Indicator/Header handle bar (Premium micro-interaction visual) -->
    <div class="w-full flex justify-center py-3 shrink-0 cursor-pointer" (click)="closeSheet()">
      <div class="w-12 h-1.5 rounded-full bg-slate-200 hover:bg-slate-300 transition-colors"></div>
    </div>



    <!-- Content Viewport -->
    <div class="grow flex flex-col overflow-hidden w-full relative min-h-0">
      <ng-content></ng-content>
    </div>
  </div>
}
