@if (renderComponent()) {
  <!-- Backdrop overlay -->
  <div
    class="bottom-sheet-backdrop"
    [class.active]="isAnimating()"
    (click)="closeSheet()"
  ></div>

  <!-- Bottom Sheet Content Container -->
  <div
    class="bottom-sheet-container"
    [class.active]="isAnimating()"
    [class.dragging]="isDragging()"
    [class.full-height]="fullHeight()"
    [style.transform]="isDragging() ? 'translateY(' + dragOffset() + 'px)' : null"
  >
    <!-- Header with drag indicator -->
    <div 
      class="w-full flex flex-col shrink-0 select-none bg-white"
      (touchstart)="onDragStart($event)"
      (mousedown)="onDragStart($event)"
    >
      <!-- Drag Indicator -->
      <div class="w-full flex justify-center py-2.5 cursor-grab active:cursor-grabbing">
        <div class="w-10 h-1.25 rounded-full bg-slate-200/80 hover:bg-slate-300 transition-colors"></div>
      </div>
    </div>

    <!-- Content Viewport -->
    <div class="grow flex flex-col overflow-hidden w-full relative min-h-0">
      @if (lazyRenderContent()) {
        <ng-content></ng-content>
      } @else {
        <!-- Skeleton Loader to keep the slide-up animation smooth and avoid sudden layout jank -->
        <div class="w-full h-full flex flex-col gap-6 p-6 animate-pulse">
          <div class="h-6 bg-slate-100 rounded-lg w-1/3"></div>
          <div class="h-44 bg-slate-100/80 rounded-2xl w-full"></div>
          <div class="space-y-3">
            <div class="h-4 bg-slate-100/70 rounded-lg w-5/6"></div>
            <div class="h-4 bg-slate-100/70 rounded-lg w-3/4"></div>
            <div class="h-4 bg-slate-100/70 rounded-lg w-1/2"></div>
          </div>
        </div>
      }
    </div>
  </div>
}
