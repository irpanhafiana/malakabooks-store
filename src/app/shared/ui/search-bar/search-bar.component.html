<form (submit)="onSubmit($event)" class="w-full relative">
      <div class="relative flex items-center w-full">
        <!-- Input search box with inner shadow and focus borders -->
        <input
          type="text"
          [(ngModel)]="searchQuery"
          name="query"
          [placeholder]="placeholder()"
          [autofocus]="autofocus()"
          class="w-full border border-slate-200 bg-white rounded-2xl py-3 pl-11 pr-16 text-sm placeholder-slate-400 text-slate-800 transition-all duration-200 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 shadow-sm"
        />
        <!-- Left search glass icon -->
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <app-icon name="search" size="18"></app-icon>
        </div>
        <!-- Right quick action search button -->
        <div class="absolute right-2 flex items-center">
          <button
            type="submit"
            class="px-4 py-1.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs transition-all cursor-pointer active:scale-95 shadow-md shadow-primary-600/15"
          >
            Search
          </button>
        </div>
      </div>
    </form>
