@if (isOpen()) {
<div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Backdrop with blurry glass layout -->
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity animate-fade-in" (click)="close()">
  </div>

  <!-- Modal Box body -->
  <div
    class="bg-white border border-slate-100 rounded-2xl shadow-xl w-full max-w-lg z-10 overflow-hidden animate-scale-in">
    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-display font-bold text-slate-800 text-base">{{ title() }}</h3>
      <button type="button" (click)="close()"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-50  cursor-pointer active:scale-90">
        <app-icon name="x" size="18"></app-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="p-5 max-h-[70vh] overflow-y-auto">
      <ng-content></ng-content>
    </div>

    <!-- Footer slot -->
    @if (hasFooter()) {
    <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2.5">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
    }
  </div>
</div>
}
