@if (isOpen()) {
<div class="fixed inset-0 z-100 flex items-center justify-center p-4">
  <!-- Backdrop with blurry glass layout -->
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" (click)="close()" (keydown.escape)="close()" role="button" tabindex="0" aria-label="Close modal backdrop">
  </div>

  <!-- Modal Box body -->
  <div [class]="'bg-white border border-slate-100 rounded-2xl shadow-xl w-full z-10 overflow-hidden flex flex-col max-h-[85vh] h-[85vh] sm:h-auto ' + maxWidth()">
    <!-- Header -->
    @if (showHeader()) {
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between shrink-0 bg-white">
      <h3 class="font-display font-bold text-slate-800 text-base">{{ title() }}</h3>
      <button type="button" (click)="close()"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-50 cursor-pointer active:scale-90">
        <app-icon name="x" size="18"></app-icon>
      </button>
    </div>
    }

    <!-- Body -->
    <div class="grow min-h-0 flex flex-col" [class.overflow-y-auto]="!noScroll()" [class.overflow-hidden]="noScroll()">
      <ng-content></ng-content>
    </div>

    <!-- Footer -->
    @if (hasFooter()) {
    <div class="sticky bottom-0 bg-white border-t border-slate-100 px-5 py-4 shrink-0">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
    }

  </div>
</div>
}
