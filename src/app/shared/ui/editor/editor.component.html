<div
  class="flex flex-col border border-slate-200 rounded-2xl bg-white overflow-hidden focus-within:border-primary-500 focus-within:ring-2 focus-within:ring-primary-500/10 transition-all">
  <!-- Toolbar -->
  <div class="flex flex-wrap items-center gap-1 p-2 bg-slate-50 border-b border-slate-200 select-none">

    <!-- Undo / Redo -->
    <button type="button" (click)="execCommand('undo')" title="Undo"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-undo text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('redo')" title="Redo"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-redo text-lg"></i>
    </button>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Text Type Dropdown -->
    <div class="relative">
      <select (change)="formatBlock($any($event.target).value); $any($event.target).value = 'p'"
        class="bg-white border border-slate-200 text-slate-600 font-semibold py-1 px-3.5 pr-8 rounded-xl text-xs focus:outline-none appearance-none cursor-pointer hover:border-slate-300 transition-colors">
        <option value="p" selected>Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code Block</option>
      </select>
      <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
        <i class="bx bx-chevron-down text-xs"></i>
      </div>
    </div>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Text Formatting -->
    <button type="button" (click)="execCommand('bold')" title="Bold" [class.bg-slate-200]="isActive('bold')"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-bold text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('italic')" title="Italic" [class.bg-slate-200]="isActive('italic')"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-italic text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('underline')" title="Underline"
      [class.bg-slate-200]="isActive('underline')"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-underline text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('strikeThrough')" title="Strikethrough"
      [class.bg-slate-200]="isActive('strikeThrough')"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-strikethrough text-lg"></i>
    </button>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Colors -->
    <div class="relative flex items-center gap-0.5">
      <!-- Forecolor Picker -->
      <button type="button" (click)="toggleForeColorPicker()" title="Text Color"
        class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer flex items-center gap-0.5">
        <i class="bx bx-font-color text-lg"></i>
        <div class="w-3 h-3 rounded-full border border-slate-200" [style.background-color]="activeForeColor()"></div>
      </button>

      <!-- Hilitecolor Picker -->
      <button type="button" (click)="toggleHiliteColorPicker()" title="Text Highlight"
        class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer flex items-center gap-0.5">
        <i class="bx bx-highlight text-lg"></i>
        <div class="w-3 h-3 rounded-full border border-slate-200"
          [style.background-color]="activeHiliteColor() || 'transparent'"></div>
      </button>

      <!-- Fore Color Dropdown -->
      @if (showForeColorPicker()) {
      <div
        class="absolute top-10 left-0 bg-white border border-slate-200 p-2.5 rounded-2xl shadow-xl z-20 grid grid-cols-5 gap-1.5 w-40 animate-scale-in">
        @for (color of textColors; track color) {
        <button type="button" (click)="setTextColor(color)"
          class="w-6 h-6 rounded-lg border border-slate-100 cursor-pointer hover:scale-110 active:scale-95 transition-transform"
          [style.background-color]="color" [title]="color"></button>
        }
      </div>
      }

      <!-- Hilite Color Dropdown -->
      @if (showHiliteColorPicker()) {
      <div
        class="absolute top-10 left-10 bg-white border border-slate-200 p-2.5 rounded-2xl shadow-xl z-20 grid grid-cols-5 gap-1.5 w-40 animate-scale-in">
        @for (color of highlightColors; track color) {
        <button type="button" (click)="setHighlightColor(color)"
          class="w-6 h-6 rounded-lg border border-slate-100 cursor-pointer hover:scale-110 active:scale-95 transition-transform"
          [style.background-color]="color || 'transparent'" [title]="color || 'No color'"></button>
        }
      </div>
      }
    </div>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Alignments -->
    <button type="button" (click)="execCommand('justifyLeft')" title="Align Left"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-align-left text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('justifyCenter')" title="Align Center"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-align-middle text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('justifyRight')" title="Align Right"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-align-right text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('justifyFull')" title="Justify"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-align-justify text-lg"></i>
    </button>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Lists -->
    <button type="button" (click)="execCommand('insertUnorderedList')" title="Bullet List"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-list-ul text-lg"></i>
    </button>
    <button type="button" (click)="execCommand('insertOrderedList')" title="Numbered List"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-list-ol text-lg"></i>
    </button>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Insert Link & Image -->
    <button type="button" (click)="insertLink()" title="Insert Link"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-link text-lg"></i>
    </button>
    <button type="button" (click)="insertImage()" title="Insert Image"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-image text-lg"></i>
    </button>
    <input #imageInput type="file" accept="image/*" hidden (change)="onImageSelected($event)" />

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <!-- Clear Formatting -->
    <button type="button" (click)="execCommand('removeFormat')" title="Clear Formatting"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-eraser text-lg"></i>
    </button>

    <div class="grow"></div>

    <!-- Toggle HTML Source -->
    <button type="button" (click)="toggleCodeView()" title="Toggle Code View" [class.bg-slate-200]="isCodeView()"
      class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer active:scale-95">
      <i class="bx bx-code-alt text-lg"></i>
    </button>
  </div>

  <!-- Workspace content -->
  <div class="relative bg-white min-h-[250px] flex flex-col">
    <!-- Rich text Editor area -->
    <div #editor class="editor-content p-5 overflow-y-auto grow" contenteditable="true" (input)="onContentChange()"
      (blur)="onTouched()" (keydown)="onKeyDown($event)" [class.hidden]="isCodeView()">
    </div>

    <!-- Raw HTML code editor area -->
    <textarea #textarea
      class="w-full p-5 font-mono text-sm bg-slate-900 text-slate-100 outline-none resize-none grow min-h-[250px]"
      (input)="onCodeChange($event)" (blur)="onTouched()" [class.hidden]="!isCodeView()">
    </textarea>
  </div>
</div>
