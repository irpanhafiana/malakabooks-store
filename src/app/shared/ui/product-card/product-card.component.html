@let prod = product();
<div class="card-product group relative">

  <!-- Clickable details container -->
  <div (click)="viewProductDetails()" class="block grow cursor-pointer">
    <!-- Image Container -->
    <div class="w-full bg-slate-50 overflow-hidden mb-3 relative flex items-center justify-center aspect-square">
      @if (prod.coverImage && !imageError()) {
      <img [src]="prod.coverImage" [alt]="prod.title" (error)="onImageError()" class="w-full h-full object-contain"
        loading="lazy" />
      } @else {
      <div
        class="w-full h-full flex items-center justify-center bg-linear-to-br from-slate-100 to-slate-200 text-slate-300">
        <app-icon name="book-open" size="40"></app-icon>
      </div>
      }
      <div class="badge-uom">{{ prod.categoryName }}</div>
    </div>

    <!-- Meta info, Title & Ratings Wrapper -->
    <div class="flex flex-col pb-2">
      <!-- Meta info -->
      <span class="text-[10px] font-medium text-slate-400 uppercase tracking-wide block mb-1">{{
        prod.author?.name }}</span>

      <!-- Title -->
      <h3
        class="text-[13px] font-semibold text-slate-800 line-clamp-2 mb-1.5 group-hover:text-primary-600  leading-tight">
        {{ prod.title }}</h3>

      <!-- Price -->
      <div class="flex flex-col">
        <app-price [value]="prod.price" size="md" class="text-primary-600 font-bold text-base"></app-price>
      </div>
    </div>
  </div>

  <!-- Rating and Sold Row -->
  <div class="flex items-center justify-between py-2 border-t border-slate-50">
    <!-- Ratings Badge -->
    <div class="flex items-center gap-1 bg-amber-50 px-1.5 py-0.5 rounded-md border border-amber-100">
      <app-icon name="star" size="10" class="text-amber-500 fill-amber-500"></app-icon>
      <span class="text-[10px] font-bold text-amber-700">{{ prod.averageRating }}</span>
    </div>

    <!-- Total Sold -->
    <span class="text-[10px] text-slate-500 font-medium">
      {{ prod.totalReviews * 12 + (prod.stock % 7) + 5 }} Terjual
    </span>
  </div>
</div>
