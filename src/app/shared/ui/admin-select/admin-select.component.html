<div class="w-full">
  @if (label()) {
  <label [for]="id()" class="block text-sm font-medium text-slate-700 mb-1">{{ label() }}</label>
  }
  <div class="relative">
    <button
      type="button"
      [id]="id()"
      [disabled]="control().disabled"
      (click)="toggleDropdown()"
      [class]="selectClass() + ' flex justify-between items-center text-left disabled:opacity-60 disabled:cursor-not-allowed'"
      style="text-align: left;">
      <span [class]="controlValue() === null || controlValue() === undefined || controlValue() === '' ? 'text-slate-400' : 'text-slate-800'">
        {{ selectedLabel() || placeholder() || 'Pilih Opsi' }}
      </span>
    </button>
    <!-- Custom Chevron Down arrow for custom select element -->
    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
      <i class="bx bx-chevron-down text-sm"></i>
    </div>

    <!-- Dropdown Panel -->
    @if (isOpen()) {
    <div class="absolute z-50 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg py-1 text-sm flex flex-col">
      <!-- Search Input -->
      <div class="p-2 border-b border-slate-100 flex items-center gap-2">
        <i class="bx bx-search text-slate-400 text-base ml-1"></i>
        <input type="text"
               #searchInput
               [value]="searchQuery()"
               (input)="onSearchInput(searchInput.value)"
               placeholder="Cari..."
               class="w-full px-2 py-1 text-sm border-0 focus:outline-none focus:ring-0 bg-transparent text-slate-800"
               (click)="$event.stopPropagation()">
      </div>

      <!-- Scrollable Options List -->
      <div class="max-h-60 overflow-y-auto">
        @for (opt of filteredOptions(); track opt.value) {
        <button type="button"
                (click)="selectOption(opt)"
                class="w-full text-left px-4 py-2 hover:bg-slate-50 transition-colors flex items-center justify-between cursor-pointer"
                [class.bg-slate-50]="controlValue() === opt.value"
                [class.text-primary-600]="controlValue() === opt.value"
                [class.font-semibold]="controlValue() === opt.value">
          <span>{{ opt.label }}</span>
          @if (controlValue() === opt.value) {
          <i class="bx bx-check text-primary-600 text-base"></i>
          }
        </button>
        } @empty {
        <div class="px-4 py-3 text-slate-400 text-center text-xs">
          Tidak ada hasil ditemukan
        </div>
        }
      </div>
    </div>
    }
  </div>
  @if (control().invalid && (control().dirty || control().touched)) {
  <span class="text-red-500 text-xs mt-1 block">
    @if (control().errors?.['required']) { {{ label() || 'Pilihan ini' }} wajib diisi. }
  </span>
  }
</div>
