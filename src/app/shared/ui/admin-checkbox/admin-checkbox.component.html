<label class="inline-flex items-start gap-3 cursor-pointer group select-none">
  <div class="relative flex items-center mt-0.5">
    <input type="checkbox" [id]="id()" [formControl]="control()" class="peer sr-only" />
    <!-- Custom styled checkbox body -->
    <div
      class="h-5 w-5 rounded-md border border-slate-300 bg-white peer-checked:bg-slate-800 peer-checked:border-slate-800 peer-focus-visible:ring-2 peer-focus-visible:ring-slate-500/30">
    </div>
    <i class="bx bx-check absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-[16px] scale-0 peer-checked:scale-100 pointer-events-none transition-transform duration-200"></i>
  </div>
  @if (label()) {
  <span class="text-sm text-slate-600 group-hover:text-slate-800">{{ label() }}</span>
  }
</label>
