<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Online Shop - Pusat Belanja & Kebutuhan Terlengkap</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Fonts & boxicons are self-hosted via styles.css (@fontsource + boxicons),
       so there are no render-blocking cross-origin CDN requests on first paint. -->

  <!-- Preload critical fonts so form controls (buttons, inputs) and their icons
       paint with the final font on the first frame — avoids the icon "pop-in"
       (boxicons FOIT) and the button/input text reflow on webfont swap. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="media/boxicons.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="media/inter-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="media/inter-latin-600-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="media/poppins-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="media/poppins-latin-600-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="media/fraunces-latin-700-normal.woff2">
  <!-- Aset Jokul/DOKU checkout dimuat lazy oleh DokuCheckoutService (URL dari
       environment), sehingga tidak ada stylesheet cross-origin render-blocking
       di sini dan dev/production memakai endpoint yang sesuai. -->
  <!-- Critical inline styles: paint the brand background + a loader immediately,
       before the Angular JS bundle bootstraps, to eliminate the white FOUC flash. -->
  <style>
    html, body { margin: 0; height: 100%; background-color: #f9fafb; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }
    .app-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9fafb;
      z-index: 9999;
    }
    .app-boot-loader__spinner {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      border: 3px solid #cdd5e0;
      border-top-color: #003049; /* primary-600 */
      animation: app-boot-spin 0.7s linear infinite;
    }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <app-root>
    <!-- Removed automatically once Angular renders into <app-root>. -->
    <div class="app-boot-loader">
      <div class="app-boot-loader__spinner"></div>
    </div>
  </app-root>
</body>
</html>
