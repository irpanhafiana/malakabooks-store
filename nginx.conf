server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Compression: Gzip & Brotli
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1000;

  # Note: Requires ngx_brotli module if Brotli is used by Nginx binary
  brotli on;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' https://accounts.google.com https://jokul.doku.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

  # Cache Control for Static Assets
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* ^/(media|assets)/ {
    add_header Cache-Control "public, max-age=86400, must-revalidate";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA Fallback: Route all unhandled requests to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
